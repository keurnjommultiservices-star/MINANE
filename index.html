function pendingStockDelta(){
  const m=new Map();
  for(const it of getQ()){if(it.kind!=='sale')continue;for(const x of it.payload.items){const k=x.article_id+'|'+x.size+'|'+x.color;m.set(k,(m.get(k)||0)+x.qty)}}
  return m;
}
function effStock(){
  const d=pendingStockDelta(),out=[];
  for(const r of STK){out.push({...r,qty:r.qty-(d.get(r.article_id+'|'+r.size+'|'+r.color)||0)})}
  return out;
}

const STORE_WA={},STORE_PAY={};
const payOf=id=>STORE_PAY[id]||{wave:'',om:'',qr:''};
const waDigits=p=>{let d=String(p||'').replace(/\D/g,'');if(d.length===9)d='221'+d;return d};
const waLink=p=>{const d=waDigits(p);return d.length>=11?'https://wa.me/'+d:''};
function qrSvg(text,px){try{const qr=qrcode(0,'M');qr.addData(text);qr.make();const n=qr.getModuleCount(),m=2,sz=n+m*2;let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))d+=`M${c+m} ${r+m}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sz} ${sz}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="${sz}" height="${sz}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}catch(e){return ''}}
const waQr=(st,px)=>{const l=waLink(STORE_WA[st]);return l?qrSvg(l,px):''};
const STORE_ORDER=['SAN','MIR','HLM','TOU','PIK'],EXTRA_COL=['#c0662b','#5b6f1f','#a03a3a','#2d7f9e','#8a6d1a','#6b5b95'];
async function loadStores(){
  let rows;try{rows=await q(sb.from('stores').select('id,name,kind,active,whatsapp,wave,om,wave_qr').order('id'));LS.set('stores',rows)}catch(e){rows=LS.get('stores',null)}
  if(!rows||!rows.length)return;
  rows=rows.slice().sort((a,b)=>{const i=STORE_ORDER.indexOf(a.id),j=STORE_ORDER.indexOf(b.id);return (i<0?99:i)-(j<0?99:j)||(a.id<b.id?-1:1)});
  Object.keys(STORES).forEach(k=>delete STORES[k]);SHOPS.length=0;let x=0;
  Object.keys(STORE_WA).forEach(k=>delete STORE_WA[k]);
  rows.forEach(r=>{STORE_PAY[r.id]={wave:r.wave||'',om:r.om||'',qr:r.wave_qr||''};STORE_WA[r.id]=r.whatsapp||'';STORES[r.id]=r.name;if(r.kind==='store'){if(r.active)SHOPS.push(r.id);if(!SHORT[r.id])SHORT[r.id]=r.name.replace(/\w\S*/g,w=>w[0]+w.slice(1).toLowerCase());if(!SCOL[r.id])SCOL[r.id]=EXTRA_COL[x++%EXTRA_COL.length]}});
  SHORT.CEN='Central';
}
let SET={seuil:20,seuil_cher:10,cher_min:30000,wave_central:'',om_central:'',remise_max_pct:10,gros_stores:['SAN'],report_email:''};

async function start(){
  $('#app').innerHTML='<div class="login"><div class="mu">Chargement…</div></div>';
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginScreen();return}
  await loadStores();await loadSettings();
  try{me=await cached('profile',async()=>q(sb.from('profiles').select('*').eq('id',session.user.id).single()))}
  catch(e){loginScreen('Profil introuvable. Contactez l’administrateur.');return}
  if(me.id!==session.user.id){me=await q(sb.from('profiles').select('*').eq('id',session.user.id).single());LS.set('profile',me)}
  if(me.role==='cashier'){S.tab='caisse';await loadCashier(true);await syncQueue()}
  else{S.tab=me.role==='central'?'stock':'apercu';await loadDirector()}
  draw();
  if(me.role==='cashier'){setInterval(()=>syncQueue(),20000);setInterval(beat,30000);beat()}
  if(me.role==='director'||me.role==='admin'){setInterval(()=>{loadDirector().then(()=>{if(S.tab==='apercu'||S.tab==='central')draw()})},60000);subscribeRT()}
}

/* ---------- chargement caissier ---------- */
async function loadCashier(initSeq){
  const st=me.store_id,day=dayOf();
  ARTS=await cached('arts',()=>qAll(()=>sb.from('articles').select('*').eq('active',true).order('name')));
  STK=await cached('stk_'+st,()=>qAll(()=>sb.from('stock').select('article_id,size,color,qty').eq('store_id',st).order('article_id')));
  VEND=await cached('vend_'+st,()=>q(sb.from('vendors').select('id,full_name').eq('store_id',st).eq('active',true).order('full_name')));
  DAYSALES=await cached('dsales_'+st+day,()=>q(sb.from('sales').select('id,ticket_no,total,sold_at,seller_id,customer_name,kind,sale_payments(method,amount)').eq('store_id',st).gte('sold_at',day+'T00:00:00Z').order('sold_at',{ascending:false})));
  DAYVERS=await cached('dvers_'+st+day,()=>q(sb.from('versements').select('id,amount,method,reference,status,created_at').eq('store_id',st).eq('day',day).order('created_at',{ascending:false})));
  DAYCLOS=await cached('dclos_'+st+day,async()=>{const r=await q(sb.from('closures').select('*').eq('store_id',st).eq('day',day));return r[0]||null});
  if(initSeq&&DAYSALES.length){
    let mx=0;for(const s of DAYSALES){const m=/-(\d+)(?:-\w+)?$/.exec(s.ticket_no);if(m)mx=Math.max(mx,+m[1])}
    const k='seq_'+st+'_'+day;LS.set(k,Math.max(LS.get(k,0),mx));
  }
}
function nextTicket(){
  const st=me.store_id,day=dayOf(),k='seq_'+st+'_'+day,n=LS.get(k,0)+1;LS.set(k,n);
  return st+'-'+day.slice(2).replace(/-/g,'')+'-'+String(n).padStart(4,'0');
}

/* ---------- affichage commun ---------- */
function paintNet(){
  const el=$('#net');if(!el)return;
  const n=getQ().length,bad=getQ().filter(x=>x.failed).length;
  if(bad){el.className='pill bad';el.textContent=bad+' à vérifier'}
  else if(!navigator.onLine){el.className='pill off';el.textContent='Hors ligne'+(n?' · '+n+' en attente':'')}
  else if(n){el.className='pill off';el.textContent=n+' en attente d’envoi'}
  else{el.className='pill ok';el.textContent='En ligne'}
}
function shell(tabs,body){
  const who=me.role==='cashier'?STORES[me.store_id]:me.role==='central'?STORES.CEN:'Direction';
  return `<header class="top"><img class="hl" src="logo.png" alt="Minane"><h1>${esc(who)}<small>${esc(me.full_name)}</small></h1><span id="net" class="pill ok">En ligne</span><button class="pill" id="pw" style="border:0;color:#fff">${ic('key-round',14)}<span class="lbl">Mot de passe</span></button><button class="pill" id="lo" style="border:0;color:#fff">${ic('log-out',14)}<span class="lbl">Quitter</span></button></header>

}
function bindShell(){
  $('#lo').onclick=logout;$('#pw').onclick=pwModal;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;draw()});

function pwModal(){
  const m=modal(`<h2 style="margin-top:0">Changer mon mot de passe</h2><label>Nouveau mot de passe (8 caractères au moins)</label><input id="np" type="password" autocomplete="new-password"><label>Retapez-le</label><input id="np2" type="password" autocomplete="new-password"><div class="err" id="pe"></div><button class="btn big" style="margin-top:12px" id="pok">Enregistrer</button><button class="btn sec big" style="margin-top:8px" id="pcx">Annuler</button>`);
  $('#pcx',m).onclick=()=>m.remove();
  $('#pok',m).onclick=async()=>{
    const a=$('#np',m).value,b=$('#np2',m).value;

const mkey=l=>l.article_id+'|'+l.size+'|'+l.color;
function artStock(id,es){return es.filter(r=>r.article_id===id).reduce((s,r)=>s+r.qty,0)}
function drawCashier(){
  const tabs=[['caisse',ic('shopping-cart')+'Caisse'],['journal',ic('receipt')+'Journal'],['stock',ic('package')+'Stock'],['credits',ic('users')+'Crédits'],['livraisons',ic('truck')+'Livraisons'],['retours',ic('undo-2')+'Retours'],['cloture',ic('lock')+'Clôture']];
  let b='';
  if(S.tab==='caisse')b=viewCaisse();
  else if(S.tab==='livraisons')b=recvBlock()+dirBons();
  else if(S.tab==='credits')b=viewCredits();
  else if(S.tab==='retours')b=dirRetours();
  else if(S.tab==='journal')b=viewJournal();
  else if(S.tab==='stock')b=viewStock(effStock(),ARTS);
  else b=viewCloture();
  $('#app').innerHTML=shell(tabs,b);
  if(S.tab==='caisse')bindCaisse();
  if(S.tab==='stock')bindStock();
  if(S.tab==='livraisons'){bindBons();bindRecv()}
  if(S.tab==='credits')bindCredits();
  if(S.tab==='retours')bindRetours();
  if(S.tab==='cloture')bindCloture();
}

  <div><div class="card"><h2>${ic('shopping-cart')}Ticket en cours</h2>
  ${S.cart.length?S.cart.map((l,i)=>`<div class="cart-line"><div><b>${esc(l.name)}</b><small>${[l.size&&'Pointure '+l.size,l.color].filter(Boolean).join(' · ')||'&nbsp;'} · ${fmt(l.price)}</small></div><div class="qty"><button data-m="${i}">−</button><b>${l.qty}</b><button data-p="${i}">+</button></div><div class="r"><b>${fmt(l.qty*l.price)}</b></div></div>`).join(''):'<div class="mu">Touchez un article pour l’ajouter.</div>'}
  ${grosOk()?`<label style="display:flex;gap:10px;align-items:center;margin-top:12px;font-weight:600"><input type="checkbox" id="gros" ${S.gros?'checked':''} style="width:22px;height:22px;flex:none;margin:0"><span>Vente en gros <small class="mu" style="font-weight:400">prix de gros, nom du client obligatoire, crédit possible</small></span></label>`:''}
  <label>Vendeur ou vendeuse</label><select id="vsel"><option value="">— choisir —</option>${VEND.map(v=>`<option value="${v.id}" ${S.vend===v.id?'selected':''}>${esc(v.full_name)}</option>`).join('')}</select>
  <div class="total"><span>Total</span><span>${fmt(total)}</span></div>
  <button class="btn big" id="pay" ${S.cart.length&&S.vend?'':'disabled'}>${ic('banknote',20)}Encaisser</button>
  ${S.cart.length?'<button class="btn sec big" style="margin-top:8px" id="clr">Vider le ticket</button>':''}</div></div></div>`;

function bindCaisse(){
  $('#wqr').onclick=waveShow;$('#scn').onclick=camScan;
  const s=$('#srch');s.onkeydown=e=>{if(e.key==='Enter'){const v=s.value.trim();if(!v)return;if(v.includes('/')){S.search='';handleScan(v);return}const L=ARTS.filter(a=>effStock().some(r=>r.article_id===a.id)&&(a.name+' '+a.id).toLowerCase().includes(v.toLowerCase()));if(L.length===1){S.search='';pickArt(L[0].id)}else if(!L.length&&handleScan(v)){S.search=''}}};s.oninput=()=>{S.search=s.value;const pos=s.selectionStart;drawCashier();bindShell();const n=$('#srch');n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll('[data-art]').forEach(b=>b.onclick=()=>pickArt(b.dataset.art));

function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+html+'</div>';m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function pickArt(id){
  const a=ARTS.find(x=>x.id===id),rows=effStock().filter(r=>r.article_id===id);
  if(!rows.length){toast('Article non stocké ici');return}
  if(rows.length===1&&!rows[0].size&&!rows[0].color){addLine(a,rows[0]);return}
  rows.sort((x,y)=>(+x.size||0)-(+y.size||0)||x.size.localeCompare(y.size)||x.color.localeCompare(y.color));
  const m=modal(`<h2 style="margin-top:0">${esc(a.name)}</h2>${rows.map((r,i)=>`<button class="combo ${r.qty<=0?'z':''}" data-i="${i}"><span>${[r.size&&'Pointure '+r.size,r.color].filter(Boolean).join(' · ')}</span><b>${r.qty<=0?'stock '+r.qty:r.qty+' en stock'}</b></button>`).join('')}<button class="btn sec big" id="cx">Annuler</button>`);
  $('#cx',m).onclick=()=>m.remove();
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.i];if(r.qty<=0&&!confirm('Le stock affiché est '+r.qty+'. Vendre quand même ?'))return;m.remove();addLine(a,r)});
}
function addLine(a,r){
  const k=a.id+'|'+r.size+'|'+r.color,ex=S.cart.find(l=>mkey(l)===k);
  if(ex)ex.qty++;else S.cart.push({article_id:a.id,name:a.name,price:unitPrice(a),size:r.size,color:r.color,qty:1});
  draw();
}
const sha=async t=>{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')};

  <div class="total" style="font-size:16px"><span>Reste à crédit</span><span id="rest">0 F</span></div>

  <div id="perr" class="err"></div>

  const disc=()=>Math.min(val('#pd'),total0),net=()=>total0-disc(),pctOf=()=>total0?disc()/total0*100:0,over=()=>pctOf()>maxPct+1e-9;

  const upd=()=>{const rest=net()-val('#pc')-val('#pw')-val('#po');$('#rest',m).textContent=fmt(Math.max(0,rest));$('#cred',m).style.display=(rest>0||S.gros)?'block':'none';

const C128='11011001100,11001101100,11001100110,10010011000,10010001100,10001001100,10011001000,10011000100,10001100100,11001001000,11001000100,11000100100,10110011100,10011011100,10011001110,10111001100,10011101100,10011100110,11001110010,11001011100,11001001110,11011100100,11001110100,11101101110,11101001100,11100101100,11100100110,11101100100,11100110100,11100110010,11011011000,11011000110,11000110110,10100011000,10001011000,10001000110,10110001000,10001101000,10001100010,11010001000,11000101000,11000100010,10110111000,10110001110,10001101110,10111011000,10111000110,10001110110,11101110110,11010001110,11000101110,11011101000,11011100010,11011101110,11101011000,11101000110,11100010110,11101101000,11101100010,11100011010,11101111010,11001000010,11110001010,10100110000,10100001100,10010110000,10010000110,10000101100,10000100110,10110010000,10110000100,10011010000,10011000010,10000110100,10000110010,11000010010,11001010000,11110111010,11000010100,10001111010,10100111100,10010111100,10010011110,10111100100,10011110100,10011110010,11110100100,11110010100,11110010010,11011011110,11011110110,11110110110,10101111000,10100011110,10001011110,10111101000,10111100010,11110101000,11110100010,10111011110,10111101110,11101011110,11110101110,11010000100,11010010000,11010011100'.split(',');
function c128(t){const v=[104];for(const ch of t){const c=ch.charCodeAt(0);if(c<32||c>126)throw new Error('caractère non codable');v.push(c-32)}let sum=v[0];for(let i=1;i<v.length;i++)sum+=v[i]*i;v.push(sum%103);return v.map(x=>C128[x]).join('')+'1100011101011'}
function bcSvg(t){const b=c128(t),Q=10;let d='',i=0;while(i<b.length){if(b[i]==='1'){let j=i;while(j<b.length&&b[j]==='1')j++;d+=`M${Q+i} 0h${j-i}v1h-${j-i}z`;i=j}else i++}return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${b.length+2*Q} 1" preserveAspectRatio="none" shape-rendering="crispEdges"><rect width="${b.length+2*Q}" height="1" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
const bcClean=t=>String(t==null?'':t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\x20-\x7e]/g,'');
const bcAscii=t=>bcClean(t).replace(/\//g,'-');
const bcCode=(id,size,color)=>(size||color)?[bcAscii(id),bcAscii(size)||'-',bcAscii(color)||'-'].join('/'):bcAscii(id);
function handleScan(raw){
  const t=bcClean(raw).trim();if(!t)return false;
  const [i,sz,co]=t.split('/'),N=x=>bcAscii(x).toUpperCase().trim();
  const a=ARTS.find(x=>N(x.id)===N(i));

  if(sz!==undefined){
    const ws=sz==='-'?'':N(sz),wc=(co===undefined||co==='-')?'':N(co),r=rows.find(r=>N(r.size)===ws&&N(r.color)===wc);
    if(r){if(r.qty<=0&&!confirm('Le stock affiché est '+r.qty+'. Vendre quand même ?'))return true;addLine(a,r);toast('Ajouté : '+a.name);return true}

/* ---------- RÉAPPROVISIONNEMENT SUGGÉRÉ ---------- */
function reaproPlan(){
  const cen=D.stock.CEN||[],plan={};
  for(const a of D.alerts.slice().sort((x,y)=>x.qty-y.qty)){
    const th=+a.threshold||0,target=Math.max(2*th,th+5),need=Math.max(1,target-a.qty);
    const lines=cen.filter(r=>r.article_id===a.article_id&&r.qty>0).sort((x,y)=>y.qty-x.qty),avail=sumBy(lines,r=>r.qty);
    (plan[a.store_id]||(plan[a.store_id]=[])).push({a,need,avail,give:Math.min(need,avail),lines});
  }
  return plan;
}
function allocLines(lines,n){const out=[];let left=n;for(const r of lines){if(left<=0)break;const t=Math.min(left,r.qty);out.push({article_id:r.article_id,size:r.size,color:r.color,qty:t});left-=t}return out}
function reaproCard(){
  if(!D.stock.CEN)return `<div class="card mu">Chargement du stock du Central…</div>`;
  const plan=reaproPlan(),ks=Object.keys(plan);
  if(!ks.length)return `<div class="card"><h2>${ic('truck')}Réapprovisionnement suggéré</h2><p class="mu" style="margin:0">Aucun article sous son seuil d’alerte dans les magasins.</p></div>`;
  return `<div class="card"><h2>${ic('truck')}Réapprovisionnement suggéré <small class="mu" style="font-weight:400">depuis le Magasin Central</small></h2>
  <p class="mu" style="margin:0 0 8px;font-size:13px">Pour chaque article sous son seuil, le système propose de remonter à environ deux fois le seuil, dans la limite du stock du Central. Ajustez les quantités puis transférez.</p>
  ${ks.map(st=>`<h3 style="margin:12px 0 4px;font-size:14px">${dot(st)}${esc(STORES[st])}</h3><div class="tw"><table><thead><tr><th>Article</th><th class="n">Stock</th><th class="n">Seuil</th><th class="n">Au Central</th><th class="n">À envoyer</th></tr></thead><tbody>${plan[st].map(p=>`<tr><td>${esc(p.a.name)}</td><td class="n"><span class="badge ${p.a.qty<=0?'b-bad':'b-wait'}">${p.a.qty}</span></td><td class="n">${p.a.threshold}</td><td class="n">${p.avail||'<span class="badge b-bad">rupture</span>'}</td><td class="n" style="width:90px"><input type="number" min="0" max="${p.avail}" value="${p.give}" ${p.avail?'':'disabled'} data-rp="${esc(st)}|${esc(p.a.article_id)}" style="padding:6px;text-align:right"></td></tr>`).join('')}</tbody></table></div><button class="btn sm" style="margin-top:8px" data-rgo="${esc(st)}">${ic('arrow-left-right',16)}Transférer vers ${esc(SHORT[st]||st)}</button> <span class="err" data-rerr="${esc(st)}"></span>`).join('')}</div>`;
}
function bindReapro(){
  if(!D.stock.CEN)loadDirStock('CEN').then(()=>{if(S.tab==='achats')draw()});
  document.querySelectorAll('[data-rgo]').forEach(b=>b.onclick=async()=>{
    const st=b.dataset.rgo,plan=reaproPlan()[st]||[],items=[],er=document.querySelector('[data-rerr="'+st+'"]');
    for(const p of plan){const inp=document.querySelector('[data-rp="'+st+'|'+p.a.article_id+'"]');if(!inp||inp.disabled)continue;const n=Math.max(0,Math.min(p.avail,Math.round(+inp.value||0)));if(n>0)items.push(...allocLines(p.lines,n))}
    if(!items.length){er.textContent='Aucune quantité à envoyer.';return}
    const tot=sumBy(items,i=>i.qty);if(!confirm('Transférer '+tot+' pièce(s) du Central vers '+STORES[st]+' ?'))return;
    b.disabled=true;
    try{await q(sb.rpc('record_transfer',{p_from:'CEN',p_to:st,p_items:items}));toast('Transfert effectué : '+tot+' pièce(s) vers '+(SHORT[st]||st));D.stock.CEN=null;D.stock[st]=null;await Promise.all([loadMoves(),loadDirector(),loadDirStock('CEN')]);draw()}
    catch(e){er.textContent='Erreur : '+(e.message||e);b.disabled=false}
  });
}

      const touched=[...new Set(CV.lines.map(l=>l.article_id))];
      if(me.role!=='central')for(const id of touched){const l=CV.lines.find(x=>x.article_id===id);try{await q(sb.from('articles').update({wholesale_price:l.price}).eq('id',id).select('id'))}catch(e){}}

  };

function bindParam(){
  const refresh=async()=>{await loadStores();await loadDirector();draw()};
  document.querySelectorAll('[data-sn]').forEach(i=>i.onchange=async()=>{const n=i.value.trim();if(!n){i.value=STORES[i.dataset.sn];return}try{await q(sb.from('stores').update({name:n}).eq('id',i.dataset.sn).select('id'));toast('Nom enregistré');await refresh()}catch(e){toast('Erreur : '+e.message)}});
  document.querySelectorAll('[data-sa]').forEach(b=>b.onclick=async()=>{const [id,a]=b.dataset.sa.split('|');if(a==='0'&&!confirm('Désactiver ce magasin ? Son historique est conservé.'))return;try{await q(sb.from('stores').update({active:a==='1'}).eq('id',id).select('id'));await refresh()}catch(e){toast('Erreur : '+e.message)}});
  const saveWa=async(id,v)=>{const d=waDigits(v);if(v.trim()&&d.length<11){toast('Numéro invalide');return}try{await q(sb.from('stores').update({whatsapp:v.trim()||null}).eq('id',id).select('id'));toast('WhatsApp enregistré');await refresh()}catch(e){toast('Erreur : '+e.message)}};

  $('#wcs').onclick=()=>saveWa('CEN',$('#wcen').value);
  document.querySelectorAll('[data-wq]').forEach(b=>b.onclick=()=>{const id=b.dataset.wq;openDoc(`<div style="text-align:center;margin-top:30mm"><img src="${location.origin}/logo.png" style="max-height:30mm"><h2>${esc(STORES[id])}</h2><p style="font-size:20px">Écrivez-nous sur WhatsApp</p>${qrSvg(waLink(STORE_WA[id]),360)}<p style="font-size:22px"><b>${esc(STORE_WA[id])}</b></p></div>`,'QR WhatsApp '+id)});
  $('#nsg').onclick=async()=>{
    const id=$('#nsc').value.trim().toUpperCase(),name=$('#nsn').value.trim();
    if(!/^[A-Z]{2,4}$/.test(id)){$('#nserr').textContent='Code : 2 à 4 lettres.';return}
    if(!name){$('#nserr').textContent='Indiquez le nom.';return}
    if(STORES[id]){$('#nserr').textContent='Ce code existe déjà.';return}
    try{await q(sb.from('stores').insert({id,name,kind:'store',active:true}).select('id'));toast('Magasin ajouté : '+name);await refresh()}catch(e){$('#nserr').textContent='Erreur : '+(e.message||e)}
  };
  $('#ugo').onclick=async()=>{
    const full_name=$('#uname').value.trim(),identifiant=$('#uid').value.trim(),password=$('#upw').value,st=$('#ust').value;
    $('#ugo').disabled=true;
    try{const r=await adminCall({action:'create_user',full_name,identifiant,password,role:st==='CEN'?'central':'cashier',store_id:st});toast('Compte créé : '+r.email);await refresh()}
    catch(e){$('#uerr').textContent=e.message;$('#ugo').disabled=false}
  };
  document.querySelectorAll('[data-pw]').forEach(b=>b.onclick=async()=>{const pw=prompt('Nouveau mot de passe (8 caractères au moins) :');if(!pw)return;try{await adminCall({action:'set_password',user_id:b.dataset.pw,password:pw});toast('Mot de passe changé')}catch(e){toast('Erreur : '+e.message)}});
  document.querySelectorAll('[data-ac]').forEach(b=>b.onclick=async()=>{const [id,a]=b.dataset.ac.split('|');if(a==='0'&&!confirm('Désactiver ce compte ? La personne ne pourra plus se connecter.'))return;try{await adminCall({action:'set_active',user_id:id,active:a==='1'});await refresh()}catch(e){toast('Erreur : '+e.message)}});
  document.querySelectorAll('[data-va]').forEach(b=>b.onclick=async()=>{const [id,a]=b.dataset.va.split('|');try{await q(sb.from('vendors').update({active:a==='1'}).eq('id',id).select('id'));await refresh()}catch(e){toast('Erreur : '+e.message)}});
  const sv=async(k,v)=>q(sb.from('settings').upsert({key:k,value:v,updated_at:new Date().toISOString()},{onConflict:'key'}).select('key'));
  $('#ssv').onclick=async()=>{const g=+$('#sg').value,pr=+$('#sp').value,c=+$('#sc').value;if(!(g>=0)||!(pr>=0)||!(c>=0)){toast('Saisissez des nombres positifs.');return}try{await Promise.all([sv('seuil',Math.round(g)),sv('cher_min',Math.round(pr)),sv('seuil_cher',Math.round(c))]);await loadSettings();toast('Seuils enregistrés');await refresh()}catch(e){toast('Erreur : '+e.message)}};

  $('#rms').onclick=async()=>{const v=+$('#rmx').value;if(!(v>=0&&v<=100)){toast('Pourcentage entre 0 et 100.');return}try{await sv('remise_max_pct',Math.round(v*10)/10);await loadSettings();toast('Plafond enregistré');draw()}catch(e){toast('Erreur : '+e.message)}};
  $('#rcs').onclick=async()=>{const c=$('#rcd').value.trim();if(!/^\d{6,}$/.test(c)){toast('Code : 6 chiffres ou plus.');return}try{await q(sb.rpc('set_discount_code',{p_code:c}));await loadSettings();toast('Code enregistré. Retenez-le : il ne peut pas être relu.');draw()}catch(e){toast('Erreur : '+e.message)}};
  const rr=$('#rcr');if(rr)rr.onclick=async()=>{if(!confirm('Supprimer le code ? Plus aucune remise au-delà du plafond ne sera possible.'))return;try{await q(sb.rpc('set_discount_code',{p_code:''}));await loadSettings();toast('Code supprimé');draw()}catch(e){toast('Erreur : '+e.message)}};
  document.querySelectorAll('[data-pw2]').forEach(i=>i.onchange=async()=>{const [id,f]=i.dataset.pw2.split('|');try{await q(sb.from('stores').update({[f]:i.value.trim()||null}).eq('id',id).select('id'));toast('Enregistré');await loadStores()}catch(e){toast('Erreur : '+e.message)}});
  document.querySelectorAll('[data-qp]').forEach(b=>b.onclick=()=>{const id=b.dataset.qp,py=payOf(id);openDoc(`<div style="text-align:center;margin-top:20mm"><img src="${location.origin}/logo.png" style="max-height:30mm"><h1 style="font-size:40px;margin:14mm 0 4mm">Payez par Wave</h1><p style="font-size:20px;margin:0 0 8mm">Scannez le code avec l’application Wave</p><img src="${py.qr}" style="width:130mm;height:130mm;object-fit:contain"><p style="font-size:28px;margin:8mm 0 2mm"><b>${esc(py.wave)}</b></p><p style="font-size:18px">${esc(STORES[id])}</p></div>`,'Affiche Wave '+id)});
  document.querySelectorAll('[data-cp]').forEach(i=>i.onchange=async()=>{const v=i.value.trim()===''?null:Math.round(+i.value);if(v!=null&&!(v>=0)){toast('Prix invalide');return}try{if(v==null)await q(sb.from('article_costs').delete().eq('article_id',i.dataset.cp).select('article_id'));else await q(sb.from('article_costs').upsert({article_id:i.dataset.cp,cost_price:v,updated_at:new Date().toISOString()},{onConflict:'article_id'}).select('article_id'));toast('Prix d’achat enregistré');await loadDirector();draw()}catch(e){toast('Erreur : '+e.message)}});
  document.querySelectorAll('[data-qd]').forEach(b=>b.onclick=async()=>{try{await q(sb.from('stores').update({wave_qr:null}).eq('id',b.dataset.qd).select('id'));await refresh()}catch(e){toast('Erreur : '+e.message)}});
  document.querySelectorAll('[data-qf]').forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;const img=new Image(),u=URL.createObjectURL(f);img.onload=async()=>{const r=Math.min(1,420/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);try{await q(sb.from('stores').update({wave_qr:c.toDataURL('image/jpeg',.85)}).eq('id',inp.dataset.qf).select('id'));toast('QR Wave enregistré');await refresh()}catch(e){toast('Erreur : '+e.message)}};img.onerror=()=>toast('Image illisible');img.src=u});
  document.querySelectorAll('[data-th]').forEach(i=>i.onchange=async()=>{const v=i.value===''||isNaN(+i.value)?null:Math.max(0,Math.round(+i.value));try{await q(sb.from('articles').update({threshold:v}).eq('id',i.dataset.th).select('id'));const a=D.arts.find(x=>x.id===i.dataset.th);if(a)a.threshold=v;toast('Seuil enregistré');await loadDirector()}catch(e){toast('Erreur : '+e.message)}});
  document.querySelectorAll('[data-ts]').forEach(sel=>sel.onchange=async()=>{
    const to=sel.value;if(!to)return;const me2=D.profiles.find(p=>p.id===sel.dataset.ts),other=D.profiles.find(p=>p.store_id===to&&p.role==='cashier'&&p.active&&p.id!==me2.id);
    if(other&&!confirm('Permuter '+me2.full_name+' ('+SHORT[me2.store_id]+') et '+other.full_name+' ('+SHORT[to]+') ?')){sel.value='';return}
    try{const from=me2.store_id;if(other)await q(sb.from('profiles').update({store_id:from}).eq('id',other.id).select('id'));await q(sb.from('profiles').update({store_id:to}).eq('id',me2.id).select('id'));toast(me2.full_name+' est maintenant à '+SHORT[to]);await refresh()}catch(e){toast('Erreur : '+e.message)}});
  $('#vg').onclick=async()=>{const n=$('#vn').value.trim();if(!n){$('#verr').textContent='Indiquez le nom.';return}try{await q(sb.from('vendors').insert({store_id:$('#vs').value,full_name:n,active:true}).select('id'));toast('Vendeur ajouté');await refresh()}catch(e){$('#verr').textContent='Erreur : '+(e.message||e)}};
}

/* ---------- CRÉDITS CLIENTS ---------- */
const CR={q:'',f:'open',mode:null,id:null};let CRED=[],CREM=[],CR_LOADED=false;
async function loadCredits(){
  CR_LOADED=true;
  try{[CRED,CREM]=await Promise.all([q(sb.from('credits').select('*,sales(ticket_no,sold_at)').order('due_date',{ascending:true})),q(sb.from('credit_reminders').select('credit_id,via,created_at').order('created_at',{ascending:false}))])}catch(e){toast('Chargement impossible : '+(e.message||e))}
}
const crRest=c=>c.amount-c.paid;
const crLast=c=>CREM.find(r=>r.credit_id===c.id);
const ddiff=(a,b)=>Math.round((new Date(a+'T00:00:00Z')-new Date(b+'T00:00:00Z'))/864e5);
function smsText(c){
  return `Bonjour ${c.customer_name}, ici MINANE SHOP (${STORES[c.store_id]}). Il vous reste ${fmt(crRest(c))} à régler${c.due_date?' (échéance le '+dmyFull(c.due_date)+')':''}. Vous pouvez passer nous voir ou régler par Wave${payOf(c.store_id).wave?' au '+payOf(c.store_id).wave:''}. Merci de votre confiance.`;
}
const waUrl=(phone,text)=>{let d=String(phone||'').replace(/\D/g,'');if(d.length===9)d='221'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(text)};
function viewCredits(){
  const today=dayStr(0),isD=me.role!=='cashier',open=CRED.filter(c=>crRest(c)>0),late=open.filter(c=>c.due_date&&c.due_date<today);
  const debt=new Set(open.map(c=>c.customer_phone||c.customer_name));
  const qq=CR.q.toLowerCase().replace(/\s/g,'');
  const list=CRED.filter(c=>{const r=crRest(c);return (CR.f==='all'||(CR.f==='open'&&r>0)||(CR.f==='late'&&r>0&&c.due_date&&c.due_date<today)||(CR.f==='paid'&&r<=0))&&(!qq||(c.customer_name+(c.customer_phone||'')).toLowerCase().replace(/\s/g,'').includes(qq))});

/* ---------- IMPORT INVENTAIRE ---------- */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const ALIAS={ref:['reference','ref','code','codearticle','id','sku'],name:['designation','nom','article','libelle','produit','description'],cat:['categorie','famille','type','rayon'],price:['prix','prixvente','pv','prixdevente','price','prixdetail'],wprice:['prixgros','prixdegros','prixgrossiste','pg','wholesale'],cost:['prixachat','prixdachat','coutunitaire','cout','coutachat','pa'],size:['pointure','taille','size'],color:['couleur','color','coloris'],qty:['quantite','qte','qty','stock']};
function parseInv(rows){
  if(!rows.length)throw new Error('Fichier vide');
  const heads=Object.keys(rows[0]),map={};
  for(const k in ALIAS){const h=heads.find(h=>ALIAS[k].includes(norm(h)));if(h)map[k]=h}
  if(!map.qty||(!map.name&&!map.ref))throw new Error('Colonnes introuvables. Il faut au moins : désignation (ou référence) et quantité.');
  const arts=new Map(),lines=[];
  for(const r of rows){
    const name=String(r[map.name]||'').trim(),ref=String(r[map.ref]||'').trim();
    if(!name&&!ref)continue;
    const id=(ref||'A-'+norm(name).toUpperCase().slice(0,24)).toUpperCase();
    const size=String(r[map.size]??'').trim(),color=String(r[map.color]??'').trim();
    const qty=Math.round(+String(r[map.qty]).replace(/\s/g,'').replace(',','.'));if(!Number.isFinite(qty)||qty<0)continue;
    const price=Math.round(+String(r[map.price]??'').replace(/\s/g,'').replace(',','.'))||0;const cp=map.cost?(Math.round(+String(r[map.cost]??'').replace(/\s/g,'').replace(',','.'))||0):0;const wp=map.wprice?(Math.round(+String(r[map.wprice]??'').replace(/\s/g,'').replace(',','.'))||0):0;
    let cat=norm(r[map.cat]);cat=cat.includes('sac')?'sacs':cat.includes('chauss')||cat.includes('soulier')||cat.includes('sandale')?'chaussures':size?'chaussures':cat?'autre':'sacs';
    const a=arts.get(id)||{id,name:name||id,category:cat,price,has_sizes:false,has_colors:false};
    if(name)a.name=name;if(price)a.price=price;if(wp)a.wholesale_price=wp;if(cp)a.cost=cp;if(size)a.has_sizes=true;if(color)a.has_colors=true;arts.set(id,a);
    lines.push({article_id:id,size,color,counted_qty:qty});
  }
  return {arts:[...arts.values()],lines,map};
}
async function readBook(f){
  const buf=await f.arrayBuffer();
  if(/\.csv$/i.test(f.name)||f.type==='text/csv'){
    let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{t=new TextDecoder('windows-1252').decode(buf)}
    t=t.replace(/^\uFEFF/,'');
    const first=t.split(/\r?\n/)[0]||'',cnt=c=>first.split(c).length-1;
    const FS=[[';',cnt(';')],['\t',cnt('\t')],[',',cnt(',')]].sort((a,b)=>b[1]-a[1])[0][0];
    return XLSX.read(t,{type:'string',FS});
  }
  return XLSX.read(buf,{type:'array'});
}

const EXP={from:'',to:'',fmt:'xlsx',busy:false};
const pOf=(l,m)=>(l||[]).filter(p=>p.method===m).reduce((t,p)=>t+p.amount,0);
const MET={cash:'Espèces',wave:'Wave',om:'Orange Money',credit:'Crédit'};
async function expData(key){
  const from=EXP.from||'2000-01-01',to=EXP.to||dayStr(0),a=from+'T00:00:00Z',b=to+'T23:59:59.999Z';
  const st=id=>STORES[id]||id||'';
  const arts=await qAll(()=>sb.from('articles').select('*').order('id')),am=new Map(arts.map(x=>[x.id,x]));
  const an=id=>(am.get(id)||{name:id}).name;
  if(key==='articles'){
    const stock=await qAll(()=>sb.from('stock').select('*').order('store_id').order('article_id'));
    const CM=new Map((await qAll(()=>sb.from('article_costs').select('*').order('article_id'))).map(c=>[c.article_id,c.cost_price]));
    return stock.map(r=>{const x=am.get(r.article_id)||{};return {'Magasin':st(r.store_id),'Référence':r.article_id,'Désignation':x.name||'','Catégorie':x.category||'','Pointure':r.size,'Couleur':r.color,'Quantité':r.qty,'Prix détail':x.price||0,'Prix de gros':x.wholesale_price||'','Prix d\'achat':(CM.get(r.article_id)||''),'Valeur au prix détail':r.qty*(x.price||0)}});
  }
  if(key==='ventes'){
    const sales=await qAll(()=>sb.from('sales').select('*,sale_items(*),sale_payments(*)').gte('sold_at',a).lte('sold_at',b).order('sold_at'));
    const vn=new Map((D.vendors||[]).map(v=>[v.id,v.full_name])),out=[];
    for(const s of sales){const pay=(s.sale_payments||[]).map(p=>(MET[p.method]||p.method)+' '+p.amount).join(' + ');
      for(const i of (s.sale_items||[]))out.push({'Date':dtFr(s.sold_at),'Ticket':s.ticket_no,'Magasin':st(s.store_id),'Vendeur':vn.get(s.seller_id)||'','Type':s.kind==='gros'?'Gros':'Détail','Client':s.customer_name||'','Référence':i.article_id,'Désignation':an(i.article_id),'Pointure':i.size,'Couleur':i.color,'Quantité':i.qty,'Prix unitaire':i.unit_price,'Montant ligne':i.qty*i.unit_price,'Remise du ticket':s.discount||0,'Total ticket':s.total,'Paiements du ticket':pay})}
    return out;
  }
  if(key==='depenses'){
    const d=await qAll(()=>sb.from('expenses').select('*').gte('day',from).lte('day',to).order('day'));
    return d.map(e=>({'Date':e.day,'Magasin':st(e.store_id),'Catégorie':e.category,'Libellé':e.label,'Montant':e.amount}));
  }
  if(key==='credits'){
    const d=await qAll(()=>sb.from('credits').select('*').gte('created_at',a).lte('created_at',b).order('created_at'));
    return d.map(c=>({'Date':dtFr(c.created_at),'Magasin':st(c.store_id),'Client':c.customer_name,'Téléphone':c.customer_phone||'','Montant':c.amount,'Payé':c.paid,'Reste dû':c.amount-c.paid,'Échéance':c.due_date||''}));
  }
  if(key==='retours'){
    const d=await qAll(()=>sb.from('returns').select('*').gte('created_at',a).lte('created_at',b).order('created_at'));
    return d.map(r=>({'Date':dtFr(r.created_at),'N°':r.return_no,'Magasin':st(r.store_id),'Référence':r.article_id,'Désignation':an(r.article_id),'Pointure':r.size,'Couleur':r.color,'Quantité':r.qty,'Montant':r.amount,'Motif':r.reason||'','Type':r.kind||''}));
  }
  if(key==='versements'){
    const d=await qAll(()=>sb.from('versements').select('*').gte('day',from).lte('day',to).order('day'));
    return d.map(v=>({'Jour':v.day,'Payeur':v.client_name?v.client_name+' (grossiste)':st(v.store_id),'Mode':MET[v.method]||v.method,'Référence':v.reference||'','Montant':v.amount,'Statut':v.status==='confirmed'?'confirmé':v.status==='rejected'?'refusé':'à confirmer'}));
  }
  if(key==='factures'){
    const d=await qAll(()=>sb.from('central_invoices').select('*,central_invoice_items(*)').gte('issued_at',a).lte('issued_at',b).order('issued_at')),out=[];
    for(const f of d)for(const i of (f.central_invoice_items||[]))out.push({'Date':dtFr(f.issued_at),'Facture':f.invoice_no,'Destinataire':f.client_name?f.client_name+' (grossiste)':st(f.store_id),'Référence':i.article_id,'Désignation':an(i.article_id),'Pointure':i.size,'Couleur':i.color,'Quantité':i.qty,'Prix unitaire':i.unit_price,'Montant ligne':i.qty*i.unit_price,'Total facture':f.total});
    return out;
  }
}
const EXPS=[['articles','Articles et stock','tous les magasins, à ce jour'],['ventes','Ventes','une ligne par article vendu'],['depenses','Dépenses',''],['credits','Crédits clients',''],['retours','Retours',''],['versements','Versements et règlements',''],['factures','Factures du Central','']];
function saveFile(name,rows,fmt){
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{'Information':'Aucune donnée sur cette période'}]);
  if(fmt==='csv'){const t='\uFEFF'+XLSX.utils.sheet_to_csv(ws,{FS:';'});const u=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
  else{const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31));XLSX.writeFile(wb,name+'.xlsx')}
}
function expCard(){
  return `<div class="card"><h2>${ic('download')}Exporter les données (Excel ou CSV)</h2>
  <div class="mu" style="margin-bottom:8px">Pour garder une copie lisible chaque semaine. La période s'applique aux ventes, dépenses, crédits, retours, versements et factures. Le stock est celui du moment.</div>
  <div class="row"><div style="flex:1"><label>Du</label><input type="date" id="exf" value="${EXP.from}"></div><div style="flex:1"><label>Au</label><input type="date" id="ext" value="${EXP.to}"></div><div style="flex:1"><label>Format</label><select id="exm"><option value="xlsx" ${EXP.fmt==='xlsx'?'selected':''}>Excel (.xlsx)</option><option value="csv" ${EXP.fmt==='csv'?'selected':''}>CSV (point-virgule)</option></select></div></div>
  <table style="margin-top:10px"><tbody>${EXPS.map(e=>`<tr><td><b>${e[1]}</b>${e[2]?` <span class="mu" style="font-size:12px">${e[2]}</span>`:''}</td><td class="n"><button class="btn sm sec" data-ex="${e[0]}">${ic('download',14)}Télécharger</button></td></tr>`).join('')}</tbody></table>
  <button class="btn big" id="exall" style="margin-top:12px">${ic('download',20)}Tout dans un seul classeur Excel</button><div class="err" id="exerr"></div></div>`;
}
function bindExport(){
  const rd=()=>{EXP.from=$('#exf').value;EXP.to=$('#ext').value;EXP.fmt=$('#exm').value};
  const stamp=()=>(EXP.to||dayStr(0));
  document.querySelectorAll('[data-ex]').forEach(b=>b.onclick=async()=>{
    rd();$('#exerr').textContent='';b.disabled=true;
    try{const k=b.dataset.ex,rows=await expData(k);saveFile('Minane-'+(EXPS.find(e=>e[0]===k)[1].replace(/\s+/g,'-'))+'-'+stamp(),rows,EXP.fmt);toast(rows.length+' lignes exportées')}
    catch(e){$('#exerr').textContent='Erreur : '+(e.message||e)}b.disabled=false});
  $('#exall').onclick=async()=>{
    rd();const b=$('#exall');b.disabled=true;$('#exerr').textContent='';
    try{const wb=XLSX.utils.book_new();
      for(const e of EXPS){const rows=await expData(e[0]);XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.length?rows:[{'Information':'Aucune donnée sur cette période'}]),e[1].slice(0,31))}
      XLSX.writeFile(wb,'Minane-Sauvegarde-'+stamp()+'.xlsx');toast('Classeur exporté')}
    catch(e){$('#exerr').textContent='Erreur : '+(e.message||e)}b.disabled=false};
}
const HSTORE=t=>{const n=norm(t).replace(/[^a-z0-9]/g,'');if(!n)return '';if(/^(san|mir|hlm|tou|pik)$/.test(n))return n.toUpperCase();if(n.includes('chrisbella')||n.includes('christbella'))return 'MIR';if(n.includes('sandaga'))return 'SAN';if(n.includes('hlm'))return 'HLM';if(n.includes('touba'))return 'TOU';if(n.includes('pikine'))return 'PIK';return ''};
const HDATE=v=>{if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(typeof v==='number'&&v>20000&&v<80000)return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const t=String(v||'').trim();let m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');m=t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}return ''};
function parseHist(rows){
  if(!rows.length)throw new Error('Le fichier est vide.');
  const keys=Object.keys(rows[0]),find=ws=>keys.find(k=>ws.some(w=>norm(k).replace(/[^a-z0-9]/g,'').includes(w)));
  const kd=find(['date','jour','day']),ks=find(['magasin','boutique','pointdevente','site','store']),kc=keys.find(k=>norm(k)==='ca')||find(['chiffredaffaires','ventes','recette','montant','total']),kt=find(['ticket','nbventes','clients']);
  if(!kd||!ks||!kc)throw new Error('Colonnes introuvables. Il faut au moins : Date, Magasin, Chiffre d’affaires.');
  const map=new Map(),badS=new Set();let badD=0,badC=0;
  for(const r of rows){
    const day=HDATE(r[kd]),st=HSTORE(r[ks]),ca=Math.round(+String(r[kc]??'').replace(/[\s\u00a0]/g,'').replace(',','.'));
    if(!day){badD++;continue}if(!st){badS.add(String(r[ks]||'(vide)'));continue}if(!(ca>=0)||isNaN(ca)){badC++;continue}
    const k=day+'|'+st,o=map.get(k)||{day,store_id:st,ca:0,tickets:0};o.ca+=ca;o.tickets+=kt?(Math.round(+String(r[kt]??'').replace(/\s/g,''))||0):0;map.set(k,o);
  }
  const list=[...map.values()].sort((a,b)=>a.day.localeCompare(b.day)||a.store_id.localeCompare(b.store_id));
  return {list,badS:[...badS],badD,badC,total:rows.length};
}
function histCard(){
  const H=D.himp;
  const by={};if(H)H.list.forEach(r=>by[r.store_id]=(by[r.store_id]||0)+r.ca);
  return `<div class="card"><h2>${ic('trending-up')}Reprise de l’historique des ventes (ancien système)</h2>
  <div class="mu" style="margin-bottom:8px">Fichier Excel ou CSV avec une ligne par jour et par magasin : Date, Magasin, Chiffre d’affaires, Tickets (facultatif). Ces chiffres servent à comparer avec l’année précédente dans le tableau de bord. Un même jour et magasin déjà présent est remplacé.</div>
  <div class="row" style="align-items:flex-end"><div style="flex:2;min-width:200px"><label style="margin-top:0">Fichier</label><input id="hfile" type="file" accept=".xlsx,.xls,.csv"></div><button class="btn sm sec" id="htpl">${ic('download',14)}Modèle</button></div>
  <div id="hmsg" class="err">${esc(D.hmsg||'')}</div>
  ${H?`<div style="margin-top:10px"><b>${H.list.length} jours-magasins · du ${dmyFull(H.list[0].day)} au ${dmyFull(H.list[H.list.length-1].day)} · ${fmt(H.list.reduce((t,r)=>t+r.ca,0))}</b>
  <table style="margin-top:6px"><tr><th>Magasin</th><th class="n">Chiffre d’affaires</th></tr>${Object.keys(by).map(k=>`<tr><td>${esc(STORES[k])}</td><td class="n">${fmt(by[k])}</td></tr>`).join('')}</table>
  ${(H.badS.length||H.badD||H.badC)?`<div class="mu" style="margin-top:6px;font-size:12.5px">Lignes ignorées : ${H.badD?H.badD+' sans date lisible. ':''}${H.badC?H.badC+' sans montant lisible. ':''}${H.badS.length?'Magasins non reconnus : '+esc(H.badS.slice(0,6).join(', '))+'. ':''}</div>`:''}
  <button class="btn big" style="margin-top:12px" id="happly">${ic('upload',20)}Importer ${H.list.length} lignes</button></div>`:''}</div>`;
}
function bindHist(){
  $('#htpl').onclick=()=>{const ws=XLSX.utils.json_to_sheet([{'Date':'15/03/2025','Magasin':'Sandaga','Chiffre d\'affaires':350000,'Tickets':14}]);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Historique');XLSX.writeFile(wb,'Minane-Modele-Historique.xlsx')};
  $('#hfile').onchange=async e=>{const f=e.target.files[0];if(!f)return;D.himp=null;D.hmsg='';
    try{const wb=await readBook(f);const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:'',cellDates:true,raw:true});D.himp=parseHist(rows);if(!D.himp.list.length){D.hmsg='Aucune ligne exploitable dans ce fichier.';D.himp=null}}
    catch(err){D.hmsg=err.message}draw()};
  const ap=$('#happly');if(ap)ap.onclick=async()=>{const H=D.himp;if(!confirm('Importer '+H.list.length+' lignes d’historique ?'))return;ap.disabled=true;ap.textContent='Envoi en cours…';
    try{for(let i=0;i<H.list.length;i+=500)await q(sb.from('history_daily').upsert(H.list.slice(i,i+500),{onConflict:'day,store_id'}).select('day'));
      D.himp=null;D.hmsg='';await loadDirector();toast('Historique importé');draw()}catch(err){D.hmsg='Erreur : '+(err.message||err);draw()}};
}
function dirImport(){
  const I=D.imp;
  return expCard()+histCard()+`<div class="card"><h2>${ic('clipboard-list')}Charger un inventaire (Excel ou CSV)</h2>
  <div class="mu" style="margin-bottom:8px">Colonnes reconnues : référence, désignation, catégorie, prix, prix de gros, prix d'achat, pointure, couleur, quantité. Les quantités du fichier remplacent le stock du magasin choisi, pour les lignes présentes dans le fichier.</div>
  <label>Magasin concerné</label><select id="ist">${Object.keys(STORES).map(k=>`<option value="${k}" ${k===(D.istore||'SAN')?'selected':''}>${STORES[k]}</option>`).join('')}</select>
  <label>Fichier</label><input id="ifile" type="file" accept=".xlsx,.xls,.csv">
  <div id="imsg" class="err">${esc(D.imsg||'')}</div>
  ${I?`<div style="margin-top:10px"><b>${I.arts.length} articles · ${I.lines.length} lignes · ${I.lines.reduce((s,l)=>s+l.counted_qty,0)} pièces</b><table style="margin-top:6px"><tr><th>Réf.</th><th>Désignation</th><th class="n">Prix</th><th>Détail</th></tr>${I.arts.slice(0,8).map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.name)}</td><td class="n">${fmt(a.price)}</td><td>${I.lines.filter(l=>l.article_id===a.id).slice(0,6).map(l=>[l.size,l.color].filter(Boolean).join(' ')+' : '+l.counted_qty).join(' · ')}</td></tr>`).join('')}</table>${I.arts.length>8?'<div class="mu">… et '+(I.arts.length-8)+' autres articles</div>':''}
  <button class="btn big" style="margin-top:12px" id="iapply">${ic('upload',20)}Appliquer l’inventaire à ${esc(STORES[D.istore||'SAN'])}</button></div>`:''}</div>`;
}
function bindImport(){
  bindExport();bindHist();
  $('#ist').onchange=e=>{D.istore=e.target.value;draw()};
  $('#ifile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;D.imp=null;D.imsg='';
    try{const wb=await readBook(f);const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});D.imp=parseInv(rows);D.impName=f.name}
    catch(err){D.imsg=err.message}
    draw();
  };
  const ap=$('#iapply');if(ap)ap.onclick=async()=>{
    const st=D.istore||'SAN',I=D.imp;
    if(!confirm('Appliquer '+I.lines.length+' lignes au stock de '+STORES[st]+' ?'))return;
    ap.disabled=true;ap.textContent='Envoi en cours…';
    try{
      for(let i=0;i<I.arts.length;i+=200)await q(sb.from('articles').upsert(I.arts.slice(i,i+200).map(({cost,...a})=>({...a,...(I.map.wprice?{wholesale_price:a.wholesale_price||null}:{}),updated_at:new Date().toISOString()})),{onConflict:'id'}).select('id'));
      const costs=I.arts.filter(a=>a.cost>0).map(a=>({article_id:a.id,cost_price:a.cost,updated_at:new Date().toISOString()}));
      for(let i=0;i<costs.length;i+=200)await q(sb.from('article_costs').upsert(costs.slice(i,i+200),{onConflict:'article_id'}).select('article_id'));
      const cur=await qAll(()=>sb.from('stock').select('article_id,size,color,qty').eq('store_id',st).order('article_id'));
      const cm=new Map(cur.map(r=>[r.article_id+'|'+r.size+'|'+r.color,r.qty]));
      const inv=await q(sb.from('inventories').insert({store_id:st,note:'Import '+(D.impName||'')}).select('id').single());
      const rows=I.lines.map(l=>({inventory_id:inv.id,...l,system_qty:cm.get(l.article_id+'|'+l.size+'|'+l.color)||0}));
      for(let i=0;i<rows.length;i+=500)await q(sb.from('inventory_lines').insert(rows.slice(i,i+500)).select('id'));
      D.imp=null;D.imsg='';D.stock[st]=null;toast('Inventaire appliqué : '+rows.length+' lignes');
      D.store=st;S.tab='stock';draw();await loadDirStock(st);draw();
    }catch(err){D.imsg='Erreur : '+(err.message||err);draw()}
  };
}
