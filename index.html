<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minane Shop – Gestion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1F5C3B">
<style>
:root{--g:#1F5C3B;--g2:#2c7a50;--bg:#f4f6f4;--card:#fff;--tx:#1b2420;--mu:#68756e;--bd:#dbe2dd;--rd:#b3261e;--or:#b26a00;--bl:#1456a8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top h1{font-size:16px;margin:0;flex:1;font-weight:700;line-height:1.2}
header.top small{display:block;font-weight:400;opacity:.85;font-size:12px}
.pill{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:#ffffff26;white-space:nowrap}
.pill.ok{background:#d6f0e0;color:#14532d}.pill.off{background:#ffe2c2;color:#7a3e00}.pill.bad{background:#ffd9d6;color:#7a1410}
nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--bd);padding:0 8px;overflow-x:auto;position:sticky;top:52px;z-index:15}
nav.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--g);border-color:var(--g)}
main{padding:12px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.art{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.art:active{background:#eaf3ed}
.art b{font-size:13px;line-height:1.25}.art span{color:var(--mu);font-size:12px}.art .p{color:var(--g);font-weight:700;font-size:14px}
.btn{border:1px solid var(--g);background:var(--g);color:#fff;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.sec{background:#fff;color:var(--g)}.btn.red{background:var(--rd);border-color:var(--rd)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{width:100%;padding:14px;font-size:16px}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
input,select{border:1px solid var(--bd);border-radius:10px;padding:10px;background:#fff;width:100%}
input[type=number]{text-align:right}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right;white-space:nowrap}
.cart-line{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.cart-line small{color:var(--mu);display:block}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:#fff;font-weight:700}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:10px 0}
.badge{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.b-ok{background:#d6f0e0;color:#14532d}.b-wait{background:#ffe2c2;color:#7a3e00}.b-bad{background:#ffd9d6;color:#7a1410}.b-gr{background:#e6ebe8;color:#46524b}
.modal{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.modal>div{border-radius:16px}}
.combo{display:flex;justify-content:space-between;width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#fff;margin-bottom:6px}
.combo.z{border-color:#f0b8b4;background:#fff6f5}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;border-radius:10px;padding:10px 16px;z-index:99;max-width:90vw}
.login{max-width:380px;margin:12vh auto;padding:0 16px}
.login h1{color:var(--g);margin:0 0 4px}
.err{color:var(--rd);font-size:13px;margin-top:8px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.kpi div{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px}.kpi small{color:var(--mu);display:block;font-size:12px}.kpi b{font-size:18px}
.mu{color:var(--mu)}.r{text-align:right}
#rcpt{display:none}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block;font:12px/1.35 monospace;width:72mm;margin:0;color:#000}}
</style>
</head>
<body>
<div id="app"></div>
<div id="rcpt"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous"></script>
<script>
'use strict';
const BUILD='1.0';
const SB_URL='https://ehnptnwvwshmcaqrupru.supabase.co';
const SB_KEY='sb_publishable_h3I7whuNEfbnfub_Q0eP6w_e77YMUqn';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const STORES={SAN:'MINANE SANDAGA',MIR:'CHRISBELLA SANDAGA',HLM:'HLM 5',TOU:'TOUBA 28',PIK:'PIKINE',CEN:'MAGASIN CENTRAL'};
const SHOPS=['SAN','MIR','HLM','TOU','PIK'];
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('fr-FR').replace(/[  ]/g,' ')+' F';
const uid=()=>crypto.randomUUID();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
// Dakar est à UTC+0 : la date UTC est la date locale
const dayOf=d=>(d||new Date()).toISOString().slice(0,10);
const hhmm=iso=>new Date(iso).toISOString().slice(11,16);
const dtFr=iso=>{const d=new Date(iso);return d.toISOString().slice(8,10)+'/'+d.toISOString().slice(5,7)+'/'+d.toISOString().slice(0,4)+' '+d.toISOString().slice(11,16)};
function toast(m,ms=3000){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
const isNet=e=>!navigator.onLine||/fetch|network|load failed|timeout/i.test(String(e&&e.message||e));
async function q(p){const r=await p;if(r.error)throw r.error;return r.data}
async function qAll(mk){let out=[],from=0;for(;;){const d=await q(mk().range(from,from+999));out=out.concat(d);if(d.length<1000)break;from+=1000}return out}
async function cached(key,fn){try{const v=await fn();LS.set(key,v);return v}catch(e){const c=LS.get(key,null);if(c==null)throw e;return c}}

let me=null,S={tab:'caisse',cart:[],search:''};
let ARTS=[],STK=[],VEND=[],DAYSALES=[],DAYVERS=[],DAYCLOS=null;

/* ---------- file d'attente hors ligne ---------- */
const getQ=()=>LS.get('queue',[]);
const setQ=v=>LS.set('queue',v);
let syncing=false;
async function pushItem(it){
  const p=it.payload;
  if(it.kind==='sale'){
    let r=await sb.from('sales').upsert(p.sale,{onConflict:'id',ignoreDuplicates:true});
    if(r.error&&r.error.code==='23505'){p.sale.ticket_no=p.sale.ticket_no+'-'+uid().slice(0,4);r=await sb.from('sales').upsert(p.sale,{onConflict:'id',ignoreDuplicates:true})}
    if(r.error)throw r.error;
    r=await sb.from('sale_items').upsert(p.items,{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error;
    if(p.pays.length){r=await sb.from('sale_payments').upsert(p.pays,{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error}
    if(p.credit){r=await sb.from('credits').upsert(p.credit,{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error}
  }else if(it.kind==='versement'){
    const r=await sb.from('versements').upsert(p,{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error;
  }else if(it.kind==='closure'){
    const r=await sb.from('closures').upsert(p,{onConflict:'store_id,day',ignoreDuplicates:true});if(r.error)throw r.error;
  }
}
async function syncQueue(){
  if(syncing||!navigator.onLine||!me||me.role!=='cashier')return;
  syncing=true;let done=0,changed=false;
  try{
    for(const it of getQ()){
      if(it.failed)continue;
      try{await pushItem(it);const cur=getQ().filter(x=>x.id!==it.id);setQ(cur);done++;changed=true}
      catch(e){
        if(isNet(e))break;
        const cur=getQ().map(x=>x.id===it.id?{...x,failed:true,err:e.message}:x);setQ(cur);changed=true;
      }
    }
  }finally{syncing=false}
  if(done)toast(done+' opération(s) synchronisée(s)');
  if(changed){await loadCashier(false);draw()}
  paintNet();
}
function pendingStockDelta(){
  const m=new Map();
  for(const it of getQ()){if(it.kind!=='sale')continue;for(const x of it.payload.items){const k=x.article_id+'|'+x.size+'|'+x.color;m.set(k,(m.get(k)||0)+x.qty)}}
  return m;
}
function effStock(){
  const d=pendingStockDelta(),out=[];
  for(const r of STK){out.push({...r,qty:r.qty-(d.get(r.article_id+'|'+r.size+'|'+r.color)||0)})}
  return out;
}

/* ---------- authentification ---------- */
function loginScreen(msg){
  $('#app').innerHTML=`<div class="login"><h1>Minane Shop</h1><div class="mu" style="margin-bottom:18px">Gestion des magasins</div>
  <label>Identifiant</label><input id="lu" type="email" autocomplete="username" autocapitalize="none" placeholder="exemple@minane-gestion.app">
  <label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password">
  <button class="btn big" style="margin-top:14px" id="lgo">Se connecter</button><div class="err" id="lerr">${esc(msg||'')}</div>
  <div class="mu" style="margin-top:22px;font-size:12px">Version ${BUILD}</div></div>`;
  const go=async()=>{
    const email=$('#lu').value.trim(),password=$('#lp').value;
    if(!navigator.onLine){$('#lerr').textContent='La première connexion demande internet.';return}
    $('#lgo').disabled=true;
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){$('#lerr').textContent='Identifiant ou mot de passe incorrect.';$('#lgo').disabled=false;return}
    start();
  };
  $('#lgo').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function start(){
  $('#app').innerHTML='<div class="login"><div class="mu">Chargement…</div></div>';
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginScreen();return}
  try{me=await cached('profile',async()=>q(sb.from('profiles').select('*').eq('id',session.user.id).single()))}
  catch(e){loginScreen('Profil introuvable. Contactez l’administrateur.');return}
  if(me.id!==session.user.id){me=await q(sb.from('profiles').select('*').eq('id',session.user.id).single());LS.set('profile',me)}
  if(me.role==='cashier'){S.tab='caisse';await loadCashier(true);await syncQueue()}
  else{S.tab=me.role==='central'?'stock':'apercu';await loadDirector()}
  draw();
  if(me.role==='cashier')setInterval(()=>syncQueue(),20000);
  if(me.role==='director'||me.role==='admin'){setInterval(()=>{loadDirector().then(()=>{if(S.tab==='apercu'||S.tab==='versements')draw()})},60000);subscribeRT()}
}
async function logout(){if(getQ().length&&!confirm('Des ventes ne sont pas encore envoyées. Se déconnecter quand même ?'))return;await sb.auth.signOut();me=null;loginScreen()}

/* ---------- chargement caissier ---------- */
async function loadCashier(initSeq){
  const st=me.store_id,day=dayOf();
  ARTS=await cached('arts',()=>qAll(()=>sb.from('articles').select('*').eq('active',true).order('name')));
  STK=await cached('stk_'+st,()=>qAll(()=>sb.from('stock').select('article_id,size,color,qty').eq('store_id',st).order('article_id')));
  VEND=await cached('vend_'+st,()=>q(sb.from('vendors').select('id,full_name').eq('store_id',st).eq('active',true).order('full_name')));
  DAYSALES=await cached('dsales_'+st+day,()=>q(sb.from('sales').select('id,ticket_no,total,sold_at,seller_id,customer_name,sale_payments(method,amount)').eq('store_id',st).gte('sold_at',day+'T00:00:00Z').order('sold_at',{ascending:false})));
  DAYVERS=await cached('dvers_'+st+day,()=>q(sb.from('versements').select('id,amount,method,reference,status,created_at').eq('store_id',st).eq('day',day).order('created_at',{ascending:false})));
  DAYCLOS=await cached('dclos_'+st+day,async()=>{const r=await q(sb.from('closures').select('*').eq('store_id',st).eq('day',day));return r[0]||null});
  if(initSeq&&DAYSALES.length){
    let mx=0;for(const s of DAYSALES){const m=/-(\d+)(?:-\w+)?$/.exec(s.ticket_no);if(m)mx=Math.max(mx,+m[1])}
    const k='seq_'+st+'_'+day;LS.set(k,Math.max(LS.get(k,0),mx));
  }
}
function nextTicket(){
  const st=me.store_id,day=dayOf(),k='seq_'+st+'_'+day,n=LS.get(k,0)+1;LS.set(k,n);
  return st+'-'+day.slice(2).replace(/-/g,'')+'-'+String(n).padStart(4,'0');
}

/* ---------- affichage commun ---------- */
function paintNet(){
  const el=$('#net');if(!el)return;
  const n=getQ().length,bad=getQ().filter(x=>x.failed).length;
  if(bad){el.className='pill bad';el.textContent=bad+' à vérifier'}
  else if(!navigator.onLine){el.className='pill off';el.textContent='Hors ligne'+(n?' · '+n+' en attente':'')}
  else if(n){el.className='pill off';el.textContent=n+' en attente d’envoi'}
  else{el.className='pill ok';el.textContent='En ligne'}
}
function shell(tabs,body){
  const who=me.role==='cashier'?STORES[me.store_id]:me.role==='central'?STORES.CEN:'Direction';
  return `<header class="top"><h1>${esc(who)}<small>${esc(me.full_name)}</small></h1><span id="net" class="pill ok">En ligne</span><button class="pill" id="lo" style="border:0;color:#fff">Quitter</button></header>
  <nav class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</nav><main>${body}</main>`;
}
function bindShell(){
  $('#lo').onclick=logout;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;draw()});
  paintNet();
}
function draw(){
  if(!me)return;
  if(me.role==='cashier')drawCashier();else drawDirector();
  bindShell();
}
window.addEventListener('online',()=>{paintNet();syncQueue()});
window.addEventListener('offline',paintNet);

/* ---------- CAISSE ---------- */
const mkey=l=>l.article_id+'|'+l.size+'|'+l.color;
function artStock(id,es){return es.filter(r=>r.article_id===id).reduce((s,r)=>s+r.qty,0)}
function drawCashier(){
  const tabs=[['caisse','Caisse'],['journal','Journal'],['stock','Stock'],['cloture','Clôture']];
  let b='';
  if(S.tab==='caisse')b=viewCaisse();
  else if(S.tab==='journal')b=viewJournal();
  else if(S.tab==='stock')b=viewStock(effStock(),ARTS);
  else b=viewCloture();
  $('#app').innerHTML=shell(tabs,b);
  if(S.tab==='caisse')bindCaisse();
  if(S.tab==='stock')bindStock();
  if(S.tab==='cloture')bindCloture();
}
function viewCaisse(){
  const es=effStock(),qq=S.search.toLowerCase();
  const list=ARTS.filter(a=>es.some(r=>r.article_id===a.id)&&(!qq||(a.name+' '+a.id).toLowerCase().includes(qq)));
  const total=S.cart.reduce((s,l)=>s+l.qty*l.price,0);
  return `<div class="grid2"><div><div class="card"><input id="srch" placeholder="Rechercher un article…" value="${esc(S.search)}">
  <div class="cards" style="margin-top:10px">${list.length?list.map(a=>`<button class="art" data-art="${esc(a.id)}"><b>${esc(a.name)}</b><span>${esc(a.category)} · stock ${artStock(a.id,es)}</span><span class="p">${fmt(a.price)}</span></button>`).join(''):'<div class="mu">Aucun article en stock dans ce magasin. Le Directeur doit charger l’inventaire.</div>'}</div></div></div>
  <div><div class="card"><h2>Ticket en cours</h2>
  ${S.cart.length?S.cart.map((l,i)=>`<div class="cart-line"><div><b>${esc(l.name)}</b><small>${[l.size&&'Pointure '+l.size,l.color].filter(Boolean).join(' · ')||'&nbsp;'} · ${fmt(l.price)}</small></div><div class="qty"><button data-m="${i}">−</button><b>${l.qty}</b><button data-p="${i}">+</button></div><div class="r"><b>${fmt(l.qty*l.price)}</b></div></div>`).join(''):'<div class="mu">Touchez un article pour l’ajouter.</div>'}
  <label>Vendeur ou vendeuse</label><select id="vsel"><option value="">— choisir —</option>${VEND.map(v=>`<option value="${v.id}" ${S.vend===v.id?'selected':''}>${esc(v.full_name)}</option>`).join('')}</select>
  <div class="total"><span>Total</span><span>${fmt(total)}</span></div>
  <button class="btn big" id="pay" ${S.cart.length&&S.vend?'':'disabled'}>Encaisser</button>
  ${S.cart.length?'<button class="btn sec big" style="margin-top:8px" id="clr">Vider le ticket</button>':''}</div></div></div>`;
}
function bindCaisse(){
  const s=$('#srch');s.oninput=()=>{S.search=s.value;const pos=s.selectionStart;drawCashier();bindShell();const n=$('#srch');n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll('[data-art]').forEach(b=>b.onclick=()=>pickArt(b.dataset.art));
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const l=S.cart[+b.dataset.m];l.qty--;if(l.qty<=0)S.cart.splice(+b.dataset.m,1);draw()});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.cart[+b.dataset.p].qty++;draw()});
  $('#vsel').onchange=e=>{S.vend=e.target.value;draw()};
  const c=$('#clr');if(c)c.onclick=()=>{S.cart=[];draw()};
  $('#pay').onclick=payModal;
}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+html+'</div>';m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function pickArt(id){
  const a=ARTS.find(x=>x.id===id),rows=effStock().filter(r=>r.article_id===id);
  if(!rows.length){toast('Article non stocké ici');return}
  if(rows.length===1&&!rows[0].size&&!rows[0].color){addLine(a,rows[0]);return}
  rows.sort((x,y)=>(+x.size||0)-(+y.size||0)||x.size.localeCompare(y.size)||x.color.localeCompare(y.color));
  const m=modal(`<h2 style="margin-top:0">${esc(a.name)}</h2>${rows.map((r,i)=>`<button class="combo ${r.qty<=0?'z':''}" data-i="${i}"><span>${[r.size&&'Pointure '+r.size,r.color].filter(Boolean).join(' · ')}</span><b>${r.qty<=0?'stock '+r.qty:r.qty+' en stock'}</b></button>`).join('')}<button class="btn sec big" id="cx">Annuler</button>`);
  $('#cx',m).onclick=()=>m.remove();
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.i];if(r.qty<=0&&!confirm('Le stock affiché est '+r.qty+'. Vendre quand même ?'))return;m.remove();addLine(a,r)});
}
function addLine(a,r){
  const k=a.id+'|'+r.size+'|'+r.color,ex=S.cart.find(l=>mkey(l)===k);
  if(ex)ex.qty++;else S.cart.push({article_id:a.id,name:a.name,price:a.price,size:r.size,color:r.color,qty:1});
  draw();
}
function payModal(){
  const total=S.cart.reduce((s,l)=>s+l.qty*l.price,0);
  const m=modal(`<h2 style="margin-top:0">Encaissement · ${fmt(total)}</h2>
  <label>Espèces</label><input id="pc" type="number" inputmode="numeric" min="0" value="${total}">
  <label>Wave</label><input id="pw" type="number" inputmode="numeric" min="0" value="0">
  <label>Orange Money</label><input id="po" type="number" inputmode="numeric" min="0" value="0">
  <div class="total" style="font-size:16px"><span>Reste à crédit</span><span id="rest">0 F</span></div>

function mergedSales(){
  const ids=new Set(DAYSALES.map(s=>s.id)),out=DAYSALES.map(s=>({...s,sync:true}));
  for(const it of getQ()){if(it.kind!=='sale'||ids.has(it.id))continue;const p=it.payload;out.push({id:p.sale.id,ticket_no:p.sale.ticket_no,total:p.sale.total,sold_at:p.sale.sold_at,seller_id:p.sale.seller_id,customer_name:p.sale.customer_name,sale_payments:p.pays.map(x=>({method:x.method,amount:x.amount})),sync:false,failed:it.failed,err:it.err})}
  return out.sort((a,b)=>b.sold_at.localeCompare(a.sold_at));
}
const lab={cash:'Espèces',wave:'Wave',om:'OM',credit:'Crédit'};
function sums(list){const t={cash:0,wave:0,om:0,credit:0,total:0};for(const s of list){t.total+=s.total;for(const p of s.sale_payments||[])t[p.method]+=p.amount}return t}

/* ---------- IMPORT INVENTAIRE ---------- */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const ALIAS={ref:['reference','ref','code','codearticle','id','sku'],name:['designation','nom','article','libelle','produit','description'],cat:['categorie','famille','type','rayon'],price:['prix','prixvente','pv','prixdevente','price'],size:['pointure','taille','size'],color:['couleur','color','coloris'],qty:['quantite','qte','qty','stock']};
function parseInv(rows){
  if(!rows.length)throw new Error('Fichier vide');
  const heads=Object.keys(rows[0]),map={};
  for(const k in ALIAS){const h=heads.find(h=>ALIAS[k].includes(norm(h)));if(h)map[k]=h}
  if(!map.qty||(!map.name&&!map.ref))throw new Error('Colonnes introuvables. Il faut au moins : désignation (ou référence) et quantité.');
  const arts=new Map(),lines=[];
  for(const r of rows){
    const name=String(r[map.name]||'').trim(),ref=String(r[map.ref]||'').trim();
    if(!name&&!ref)continue;
    const id=(ref||'A-'+norm(name).toUpperCase().slice(0,24)).toUpperCase();
    const size=String(r[map.size]??'').trim(),color=String(r[map.color]??'').trim();
    const qty=Math.round(+String(r[map.qty]).replace(/\s/g,'').replace(',','.'));if(!Number.isFinite(qty)||qty<0)continue;
    const price=Math.round(+String(r[map.price]??'').replace(/\s/g,'').replace(',','.'))||0;
    let cat=norm(r[map.cat]);cat=cat.includes('sac')?'sacs':cat.includes('chauss')||cat.includes('soulier')||cat.includes('sandale')?'chaussures':size?'chaussures':cat?'autre':'sacs';
    const a=arts.get(id)||{id,name:name||id,category:cat,price,has_sizes:false,has_colors:false};
    if(name)a.name=name;if(price)a.price=price;if(size)a.has_sizes=true;if(color)a.has_colors=true;arts.set(id,a);
    lines.push({article_id:id,size,color,counted_qty:qty});
  }
  return {arts:[...arts.values()],lines,map};
}
async function readBook(f){
  const buf=await f.arrayBuffer();
  if(/\.csv$/i.test(f.name)||f.type==='text/csv'){
    let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{t=new TextDecoder('windows-1252').decode(buf)}
    t=t.replace(/^\uFEFF/,'');
    const first=t.split(/\r?\n/)[0]||'',cnt=c=>first.split(c).length-1;
    const FS=[[';',cnt(';')],['\t',cnt('\t')],[',',cnt(',')]].sort((a,b)=>b[1]-a[1])[0][0];
    return XLSX.read(t,{type:'string',FS});
  }
  return XLSX.read(buf,{type:'array'});
}

  const I=D.imp;
  return `<div class="card"><h2>Charger un inventaire (Excel ou CSV)</h2>
  <div class="mu" style="margin-bottom:8px">Colonnes reconnues : référence, désignation, catégorie, prix, pointure, couleur, quantité. Les quantités du fichier remplacent le stock du magasin choisi, pour les lignes présentes dans le fichier.</div>

  <div id="imsg" class="err">${esc(D.imsg||'')}</div>
  ${I?`<div style="margin-top:10px"><b>${I.arts.length} articles · ${I.lines.length} lignes · ${I.lines.reduce((s,l)=>s+l.counted_qty,0)} pièces</b><table style="margin-top:6px"><tr><th>Réf.</th><th>Désignation</th><th class="n">Prix</th><th>Détail</th></tr>${I.arts.slice(0,8).map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.name)}</td><td class="n">${fmt(a.price)}</td><td>${I.lines.filter(l=>l.article_id===a.id).slice(0,6).map(l=>[l.size,l.color].filter(Boolean).join(' ')+' : '+l.counted_qty).join(' · ')}</td></tr>`).join('')}</table>${I.arts.length>8?'<div class="mu">… et '+(I.arts.length-8)+' autres articles</div>':''}
  <button class="btn big" style="margin-top:12px" id="iapply">Appliquer l’inventaire à ${esc(STORES[D.istore||'SAN'])}</button></div>`:''}</div>`;
}
function bindImport(){
  $('#ist').onchange=e=>{D.istore=e.target.value;draw()};
  $('#ifile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;D.imp=null;D.imsg='';
    try{const wb=await readBook(f);const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});D.imp=parseInv(rows);D.impName=f.name}
    catch(err){D.imsg=err.message}
    draw();
  };
  const ap=$('#iapply');if(ap)ap.onclick=async()=>{
    const st=D.istore||'SAN',I=D.imp;
    if(!confirm('Appliquer '+I.lines.length+' lignes au stock de '+STORES[st]+' ?'))return;
    ap.disabled=true;ap.textContent='Envoi en cours…';
    try{
      for(let i=0;i<I.arts.length;i+=200)await q(sb.from('articles').upsert(I.arts.slice(i,i+200).map(a=>({...a,updated_at:new Date().toISOString()})),{onConflict:'id'}).select('id'));
      const cur=await qAll(()=>sb.from('stock').select('article_id,size,color,qty').eq('store_id',st).order('article_id'));
      const cm=new Map(cur.map(r=>[r.article_id+'|'+r.size+'|'+r.color,r.qty]));
      const inv=await q(sb.from('inventories').insert({store_id:st,note:'Import '+(D.impName||'')}).select('id').single());
      const rows=I.lines.map(l=>({inventory_id:inv.id,...l,system_qty:cm.get(l.article_id+'|'+l.size+'|'+l.color)||0}));
      for(let i=0;i<rows.length;i+=500)await q(sb.from('inventory_lines').insert(rows.slice(i,i+500)).select('id'));
      D.imp=null;D.imsg='';D.stock[st]=null;toast('Inventaire appliqué : '+rows.length+' lignes');
      D.store=st;S.tab='stock';draw();await loadDirStock(st);draw();
    }catch(err){D.imsg='Erreur : '+(err.message||err);draw()}
  };
}

/* ---------- démarrage ---------- */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
start();
</script>
