*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}

header.top small{display:block;font-weight:400;opacity:.85;font-size:12px}
.pill{border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;background:#ffffff26;white-space:nowrap}
.pill.ok{background:#d6f0e0;color:#14532d}.pill.off{background:#ffe2c2;color:#7a3e00}.pill.bad{background:#ffd9d6;color:#7a1410}
nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--bd);padding:0 8px;overflow-x:auto;position:sticky;top:52px;z-index:15}
nav.tabs button{border:0;background:none;padding:12px 14px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button.on{color:var(--g);border-color:var(--g)}
main{padding:12px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}

.art:active{background:#eaf3ed}

.btn.sec{background:#fff;color:var(--g)}.btn.red{background:var(--rd);border-color:var(--rd)}

label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.03em}

.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}

nav.tabs button .ic{margin-right:5px}.kpi small .ic{width:15px;height:15px;margin-right:4px;vertical-align:-3px}.btn .ic{stroke:#fff;color:#fff!important}.btn.sec .ic{stroke:currentColor}

.tw{overflow-x:auto}.lg{display:flex;gap:14px;font-size:12px;color:var(--mu);margin-bottom:4px}.lg .sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
@keyframes bl{50%{opacity:.45}}.blink{animation:bl 1.3s infinite}
.mu{color:var(--mu)}.r{text-align:right}
#rcpt{display:none}
@media print{body>*:not(#rcpt){display:none!important}#rcpt{display:block;font:12px/1.35 monospace;width:72mm;margin:0;color:#000}}

=\"M14 2v4a2 2 0 0 0 2 2h4\"/><path d=\"M10 9H8\"/><path d=\"M16 13H8\"/><path d=\"M16 17H8\"/>","file-spreadsheet": "<path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"/><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"/><path d=\"M8 13h2\"/><path d=\"M14 13h2\"/><path d=\"M8 17h2\"/><path d=\"M14 17h2\"/>"};

function toast(m,ms=3000){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms)}
const isNet=e=>!navigator.onLine||/fetch|network|load failed|timeout/i.test(String(e&&e.message||e));
async function q(p){const r=await p;if(r.error)throw r.error;return r.data}
async function qAll(mk){let out=[],from=0;for(;;){const d=await q(mk().range(from,from+999));out=out.concat(d);if(d.length<1000)break;from+=1000}return out}
async function cached(key,fn){try{const v=await fn();LS.set(key,v);return v}catch(e){const c=LS.get(key,null);if(c==null)throw e;return c}}

let me=null,S={tab:'caisse',cart:[],search:''};
let ARTS=[],STK=[],VEND=[],DAYSALES=[],DAYVERS=[],DAYCLOS=null;

/* ---------- file d'attente hors ligne ---------- */
const getQ=()=>LS.get('queue',[]);
const setQ=v=>LS.set('queue',v);
let syncing=false;
async function pushItem(it){
  const p=it.payload;
  if(it.kind==='sale'){
    let r=await sb.from('sales').upsert(p.sale,{onConflict:'id',ignoreDuplicates:true});
    if(r.error&&r.error.code==='23505'){p.sale.ticket_no=p.sale.ticket_no+'-'+uid().slice(0,4);r=await sb.from('sales').upsert(p.sale,{onConflict:'id',ignoreDuplicates:true})}
    if(r.error)throw r.error;
    r=await sb.from('sale_items').upsert(p.items,{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error;
    if(p.pays.length){r=await sb.from('sale_payments').upsert(p.pays,{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error}
    if(p.credit){r=await sb.from('credits').upsert(p.credit,{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error}
  }else if(it.kind==='versement'){
    const r=await sb.from('versements').upsert(p,{onConflict:'id',ignoreDuplicates:true});if(r.error)throw r.error;
  }else if(it.kind==='closure'){
    const r=await sb.from('closures').upsert(p,{onConflict:'store_id,day',ignoreDuplicates:true});if(r.error)throw r.error;
  }
}
function syncQueue(){return _sync().catch(e=>{syncing=false;console.warn('synchro',e&&e.message||e)})}
async function _sync(){
  if(syncing||!navigator.onLine||!me||me.role!=='cashier')return;
  syncing=true;let done=0,changed=false;
  try{
    for(const it of getQ()){
      if(it.failed)continue;
      try{await pushItem(it);const cur=getQ().filter(x=>x.id!==it.id);setQ(cur);done++;changed=true}
      catch(e){
        if(isNet(e))break;
        const cur=getQ().map(x=>x.id===it.id?{...x,failed:true,err:e.message}:x);setQ(cur);changed=true;
      }
    }
  }finally{syncing=false}
  if(done)toast(done+' opération(s) synchronisée(s)');
  beat();
  if(changed){await loadCashier(false);draw()}
  paintNet();
}
async function beat(){
  if(!navigator.onLine||!me||me.role!=='cashier')return;
  try{await sb.from('store_status').upsert({store_id:me.store_id,last_seen:new Date().toISOString(),pending:getQ().length},{onConflict:'store_id'})}catch{}
}
function pendingStockDelta(){
  const m=new Map();
  for(const it of getQ()){if(it.kind!=='sale')continue;for(const x of it.payload.items){const k=x.article_id+'|'+x.size+'|'+x.color;m.set(k,(m.get(k)||0)+x.qty)}}
  return m;
}
function effStock(){
  const d=pendingStockDelta(),out=[];
  for(const r of STK){out.push({...r,qty:r.qty-(d.get(r.article_id+'|'+r.size+'|'+r.color)||0)})}
  return out;
}

/* ---------- authentification ---------- */
function loginScreen(msg){
  $('#app').innerHTML=`<div class="login"><div class="logo"><img src="logo.png" alt="Minane"></div><div class="mu" style="margin:12px 0 18px;text-align:center">Gestion des magasins</div>
  <label>Identifiant</label><input id="lu" type="email" autocomplete="username" autocapitalize="none" placeholder="exemple@minane-gestion.app">
  <label>Mot de passe</label><input id="lp" type="password" autocomplete="current-password">
  <button class="btn big" style="margin-top:14px" id="lgo">Se connecter</button><div class="err" id="lerr">${esc(msg||'')}</div>
  <div class="mu" style="margin-top:22px;font-size:12px">Version ${BUILD}</div></div>`;
  const go=async()=>{
    const email=$('#lu').value.trim(),password=$('#lp').value;
    if(!navigator.onLine){$('#lerr').textContent='La première connexion demande internet.';return}
    $('#lgo').disabled=true;
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error){$('#lerr').textContent='Identifiant ou mot de passe incorrect.';$('#lgo').disabled=false;return}
    start();
  };
  $('#lgo').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function start(){
  $('#app').innerHTML='<div class="login"><div class="mu">Chargement…</div></div>';
  const {data:{session}}=await sb.auth.getSession();
  if(!session){loginScreen();return}
  try{me=await cached('profile',async()=>q(sb.from('profiles').select('*').eq('id',session.user.id).single()))}
  catch(e){loginScreen('Profil introuvable. Contactez l’administrateur.');return}
  if(me.id!==session.user.id){me=await q(sb.from('profiles').select('*').eq('id',session.user.id).single());LS.set('profile',me)}
  if(me.role==='cashier'){S.tab='caisse';await loadCashier(true);await syncQueue()}
  else{S.tab=me.role==='central'?'stock':'apercu';await loadDirector()}
  draw();
  if(me.role==='cashier'){setInterval(()=>syncQueue(),20000);setInterval(beat,30000);beat()}
  if(me.role==='director'||me.role==='admin'){setInterval(()=>{loadDirector().then(()=>{if(S.tab==='apercu'||S.tab==='central')draw()})},60000);subscribeRT()}
}
async function logout(){if(getQ().length&&!confirm('Des ventes ne sont pas encore envoyées. Se déconnecter quand même ?'))return;await sb.auth.signOut();me=null;loginScreen()}

async function loadCashier(initSeq){
  const st=me.store_id,day=dayOf();
  ARTS=await cached('arts',()=>qAll(()=>sb.from('articles').select('*').eq('active',true).order('name')));
  STK=await cached('stk_'+st,()=>qAll(()=>sb.from('stock').select('article_id,size,color,qty').eq('store_id',st).order('article_id')));
  VEND=await cached('vend_'+st,()=>q(sb.from('vendors').select('id,full_name').eq('store_id',st).eq('active',true).order('full_name')));
  DAYSALES=await cached('dsales_'+st+day,()=>q(sb.from('sales').select('id,ticket_no,total,sold_at,seller_id,customer_name,sale_payments(method,amount)').eq('store_id',st).gte('sold_at',day+'T00:00:00Z').order('sold_at',{ascending:false})));
  DAYVERS=await cached('dvers_'+st+day,()=>q(sb.from('versements').select('id,amount,method,reference,status,created_at').eq('store_id',st).eq('day',day).order('created_at',{ascending:false})));
  DAYCLOS=await cached('dclos_'+st+day,async()=>{const r=await q(sb.from('closures').select('*').eq('store_id',st).eq('day',day));return r[0]||null});
  if(initSeq&&DAYSALES.length){
    let mx=0;for(const s of DAYSALES){const m=/-(\d+)(?:-\w+)?$/.exec(s.ticket_no);if(m)mx=Math.max(mx,+m[1])}
    const k='seq_'+st+'_'+day;LS.set(k,Math.max(LS.get(k,0),mx));
  }
}
function nextTicket(){
  const st=me.store_id,day=dayOf(),k='seq_'+st+'_'+day,n=LS.get(k,0)+1;LS.set(k,n);
  return st+'-'+day.slice(2).replace(/-/g,'')+'-'+String(n).padStart(4,'0');
}

/* ---------- affichage commun ---------- */
function paintNet(){
  const el=$('#net');if(!el)return;
  const n=getQ().length,bad=getQ().filter(x=>x.failed).length;
  if(bad){el.className='pill bad';el.textContent=bad+' à vérifier'}
  else if(!navigator.onLine){el.className='pill off';el.textContent='Hors ligne'+(n?' · '+n+' en attente':'')}
  else if(n){el.className='pill off';el.textContent=n+' en attente d’envoi'}
  else{el.className='pill ok';el.textContent='En ligne'}
}
function shell(tabs,body){
  const who=me.role==='cashier'?STORES[me.store_id]:me.role==='central'?STORES.CEN:'Direction';
  return `<header class="top"><img class="hl" src="logo.png" alt="Minane"><h1>${esc(who)}<small>${esc(me.full_name)}</small></h1><span id="net" class="pill ok">En ligne</span><button class="pill" id="pw" style="border:0;color:#fff">${ic('key-round',14)}Mot de passe</button><button class="pill" id="lo" style="border:0;color:#fff">${ic('log-out',14)}Quitter</button></header>
  <nav class="tabs">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${l}</button>`).join('')}</nav><main>${body}</main>`;
}
function bindShell(){
  $('#lo').onclick=logout;$('#pw').onclick=pwModal;
  document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;draw()});
  paintNet();
}
function pwModal(){
  const m=modal(`<h2 style="margin-top:0">Changer mon mot de passe</h2><label>Nouveau mot de passe (8 caractères au moins)</label><input id="np" type="password" autocomplete="new-password"><label>Retapez-le</label><input id="np2" type="password" autocomplete="new-password"><div class="err" id="pe"></div><button class="btn big" style="margin-top:12px" id="pok">Enregistrer</button><button class="btn sec big" style="margin-top:8px" id="pcx">Annuler</button>`);
  $('#pcx',m).onclick=()=>m.remove();
  $('#pok',m).onclick=async()=>{
    const a=$('#np',m).value,b=$('#np2',m).value;
    if(a.length<8){$('#pe',m).textContent='Au moins 8 caractères.';return}
    if(a!==b){$('#pe',m).textContent='Les deux mots de passe sont différents.';return}
    if(!navigator.onLine){$('#pe',m).textContent='Il faut internet pour changer le mot de passe.';return}
    const {error}=await sb.auth.updateUser({password:a});
    if(error){$('#pe',m).textContent='Impossible : '+error.message;return}
    m.remove();toast('Mot de passe modifié');
  };
}
function draw(){
  if(!me)return;
  if(me.role==='cashier')drawCashier();else drawDirector();
  bindShell();
}
window.addEventListener('online',()=>{paintNet();beat();syncQueue()});
window.addEventListener('offline',paintNet);

/* ---------- CAISSE ---------- */
const mkey=l=>l.article_id+'|'+l.size+'|'+l.color;
function artStock(id,es){return es.filter(r=>r.article_id===id).reduce((s,r)=>s+r.qty,0)}
function drawCashier(){
  const tabs=[['caisse',ic('shopping-cart')+'Caisse'],['journal',ic('receipt')+'Journal'],['stock',ic('package')+'Stock'],['cloture',ic('lock')+'Clôture']];
  let b='';
  if(S.tab==='caisse')b=viewCaisse();
  else if(S.tab==='journal')b=viewJournal();
  else if(S.tab==='stock')b=viewStock(effStock(),ARTS);
  else b=viewCloture();
  $('#app').innerHTML=shell(tabs,b);
  if(S.tab==='caisse')bindCaisse();
  if(S.tab==='stock')bindStock();
  if(S.tab==='cloture')bindCloture();
}
function viewCaisse(){
  const es=effStock(),qq=S.search.toLowerCase();
  const list=ARTS.filter(a=>es.some(r=>r.article_id===a.id)&&(!qq||(a.name+' '+a.id).toLowerCase().includes(qq)));
  const total=S.cart.reduce((s,l)=>s+l.qty*l.price,0);
  return `<div class="grid2"><div><div class="card"><input id="srch" placeholder="Rechercher un article…" value="${esc(S.search)}">
  <div class="cards" style="margin-top:10px">${list.length?list.map(a=>`<button class="art" data-art="${esc(a.id)}"><b>${esc(a.name)}</b><span>${esc(a.category)} · stock ${artStock(a.id,es)}</span><span class="p">${fmt(a.price)}</span></button>`).join(''):'<div class="mu">Aucun article en stock dans ce magasin. Le Directeur doit charger l’inventaire.</div>'}</div></div></div>
  <div><div class="card"><h2>${ic('shopping-cart')}Ticket en cours</h2>
  ${S.cart.length?S.cart.map((l,i)=>`<div class="cart-line"><div><b>${esc(l.name)}</b><small>${[l.size&&'Pointure '+l.size,l.color].filter(Boolean).join(' · ')||'&nbsp;'} · ${fmt(l.price)}</small></div><div class="qty"><button data-m="${i}">−</button><b>${l.qty}</b><button data-p="${i}">+</button></div><div class="r"><b>${fmt(l.qty*l.price)}</b></div></div>`).join(''):'<div class="mu">Touchez un article pour l’ajouter.</div>'}
  <label>Vendeur ou vendeuse</label><select id="vsel"><option value="">— choisir —</option>${VEND.map(v=>`<option value="${v.id}" ${S.vend===v.id?'selected':''}>${esc(v.full_name)}</option>`).join('')}</select>
  <div class="total"><span>Total</span><span>${fmt(total)}</span></div>
  <button class="btn big" id="pay" ${S.cart.length&&S.vend?'':'disabled'}>${ic('banknote',20)}Encaisser</button>
  ${S.cart.length?'<button class="btn sec big" style="margin-top:8px" id="clr">Vider le ticket</button>':''}</div></div></div>`;
}
function bindCaisse(){
  const s=$('#srch');s.oninput=()=>{S.search=s.value;const pos=s.selectionStart;drawCashier();bindShell();const n=$('#srch');n.focus();n.setSelectionRange(pos,pos)};
  document.querySelectorAll('[data-art]').forEach(b=>b.onclick=()=>pickArt(b.dataset.art));
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const l=S.cart[+b.dataset.m];l.qty--;if(l.qty<=0)S.cart.splice(+b.dataset.m,1);draw()});
  document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.cart[+b.dataset.p].qty++;draw()});
  $('#vsel').onchange=e=>{S.vend=e.target.value;draw()};
  const c=$('#clr');if(c)c.onclick=()=>{S.cart=[];draw()};
  $('#pay').onclick=payModal;
}
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML='<div>'+html+'</div>';m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}
function pickArt(id){
  const a=ARTS.find(x=>x.id===id),rows=effStock().filter(r=>r.article_id===id);
  if(!rows.length){toast('Article non stocké ici');return}
  if(rows.length===1&&!rows[0].size&&!rows[0].color){addLine(a,rows[0]);return}
  rows.sort((x,y)=>(+x.size||0)-(+y.size||0)||x.size.localeCompare(y.size)||x.color.localeCompare(y.color));
  const m=modal(`<h2 style="margin-top:0">${esc(a.name)}</h2>${rows.map((r,i)=>`<button class="combo ${r.qty<=0?'z':''}" data-i="${i}"><span>${[r.size&&'Pointure '+r.size,r.color].filter(Boolean).join(' · ')}</span><b>${r.qty<=0?'stock '+r.qty:r.qty+' en stock'}</b></button>`).join('')}<button class="btn sec big" id="cx">Annuler</button>`);
  $('#cx',m).onclick=()=>m.remove();
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const r=rows[+b.dataset.i];if(r.qty<=0&&!confirm('Le stock affiché est '+r.qty+'. Vendre quand même ?'))return;m.remove();addLine(a,r)});
}
function addLine(a,r){
  const k=a.id+'|'+r.size+'|'+r.color,ex=S.cart.find(l=>mkey(l)===k);
  if(ex)ex.qty++;else S.cart.push({article_id:a.id,name:a.name,price:a.price,size:r.size,color:r.color,qty:1});
  draw();
}
function payModal(){
  const total=S.cart.reduce((s,l)=>s+l.qty*l.price,0);
  const m=modal(`<h2 style="margin-top:0">Encaissement · ${fmt(total)}</h2>
  <label>Espèces</label><input id="pc" type="number" inputmode="numeric" min="0" value="${total}">
  <label>Wave</label><input id="pw" type="number" inputmode="numeric" min="0" value="0">
  <label>Orange Money</label><input id="po" type="number" inputmode="numeric" min="0" value="0">
  <div class="total" style="font-size:16px"><span>Reste à crédit</span><span id="rest">0 F</span></div>
  <div id="cred" style="display:none"><label>Nom du client (obligatoire pour un crédit)</label><input id="cn"><label>Téléphone</label><input id="cp" inputmode="tel"><label>Date limite</label><input id="cd" type="date"></div>
  <div id="perr" class="err"></div>
  <button class="btn big" style="margin-top:12px" id="ok">${ic('check',20)}Valider la vente</button><button class="btn sec big" style="margin-top:8px" id="cx">Annuler</button>`);
  const val=id=>Math.max(0,Math.round(+$(id,m).value||0));
  const upd=()=>{const rest=total-val('#pc')-val('#pw')-val('#po');$('#rest',m).textContent=fmt(Math.max(0,rest));$('#cred',m).style.display=rest>0?'block':'none';return rest};
  ['#pc','#pw','#po'].forEach(i=>$(i,m).oninput=upd);upd();
  $('#cx',m).onclick=()=>m.remove();
  $('#ok',m).onclick=()=>{
    const rest=upd();
    if(rest<0){$('#perr',m).textContent='Le montant reçu dépasse le total.';return}
    if(rest>0&&!$('#cn',m).value.trim()){$('#perr',m).textContent='Indiquez le nom du client pour le crédit.';return}
    const info={cash:val('#pc'),wave:val('#pw'),om:val('#po'),rest,name:$('#cn',m).value.trim(),phone:$('#cp',m).value.trim(),due:$('#cd',m).value||null};
    m.remove();finishSale(total,info);
  };
}
function finishSale(total,i){
  const id=uid(),now=new Date().toISOString(),ticket=nextTicket();
  const sale={id,store_id:me.store_id,ticket_no:ticket,seller_id:S.vend,customer_name:i.name||null,customer_phone:i.phone||null,total,sold_at:now};
  const items=S.cart.map(l=>({id:uid(),sale_id:id,article_id:l.article_id,size:l.size,color:l.color,qty:l.qty,unit_price:l.price}));
  const pays=[['cash',i.cash],['wave',i.wave],['om',i.om],['credit',i.rest]].filter(x=>x[1]>0).map(x=>({id:uid(),sale_id:id,method:x[0],amount:x[1]}));
  const credit=i.rest>0?{id:uid(),sale_id:id,store_id:me.store_id,customer_name:i.name,customer_phone:i.phone||null,amount:i.rest,due_date:i.due}:null;
  const lines=S.cart.map(l=>({...l}));
  setQ([...getQ(),{id,kind:'sale',payload:{sale,items,pays,credit},at:now}]);
  const vname=(VEND.find(v=>v.id===S.vend)||{}).full_name||'';
  S.cart=[];draw();receipt(sale,lines,pays,vname);
  syncQueue();
}
function receipt(sale,lines,pays,vname){
  const lab={cash:'Espèces',wave:'Wave',om:'Orange Money',credit:'Crédit'};
  const html=`<div style="text-align:center"><img src="logo-ticket.png" alt="MINANE" style="width:46mm;height:auto"><br><b style="font-size:15px">MINANE SHOP</b><br>${esc(STORES[sale.store_id])}<br>${dtFr(sale.sold_at)}<br>Ticket ${esc(sale.ticket_no)}</div><hr>
  ${lines.map(l=>`${esc(l.name)}<br>&nbsp;&nbsp;${[l.size&&'P'+l.size,l.color].filter(Boolean).join(' ')} ${l.qty} x ${l.price} = <b>${l.qty*l.price}</b><br>`).join('')}<hr>
  <b>TOTAL ${sale.total} F</b><br>${pays.map(p=>lab[p.method]+' : '+p.amount+' F').join('<br>')}<br>${vname?'Vendeur : '+esc(vname)+'<br>':''}${sale.customer_name?'Client : '+esc(sale.customer_name)+'<br>':''}<br><div style="text-align:center">Merci de votre visite</div>`;
  $('#rcpt').innerHTML=html;
  const m=modal(`<h2 style="margin-top:0">Vente enregistrée</h2><div class="mu" style="margin-bottom:10px">Ticket ${esc(sale.ticket_no)} · ${fmt(sale.total)}${navigator.onLine?'':' · sera envoyé au retour d’internet'}</div><button class="btn big" id="pr">${ic('printer',20)}Imprimer le reçu</button><button class="btn sec big" style="margin-top:8px" id="nw">${ic('plus')}Nouvelle vente</button>`);
  $('#pr',m).onclick=()=>window.print();$('#nw',m).onclick=()=>m.remove();
}

/* ---------- JOURNAL ---------- */
function mergedSales(){
  const ids=new Set(DAYSALES.map(s=>s.id)),out=DAYSALES.map(s=>({...s,sync:true}));
  for(const it of getQ()){if(it.kind!=='sale'||ids.has(it.id))continue;const p=it.payload;out.push({id:p.sale.id,ticket_no:p.sale.ticket_no,total:p.sale.total,sold_at:p.sale.sold_at,seller_id:p.sale.seller_id,customer_name:p.sale.customer_name,sale_payments:p.pays.map(x=>({method:x.method,amount:x.amount})),sync:false,failed:it.failed,err:it.err})}
  return out.sort((a,b)=>b.sold_at.localeCompare(a.sold_at));
}
const lab={cash:'Espèces',wave:'Wave',om:'OM',credit:'Crédit'};
function sums(list){const t={cash:0,wave:0,om:0,credit:0,total:0};for(const s of list){t.total+=s.total;for(const p of s.sale_payments||[])t[p.method]+=p.amount}return t}
function viewJournal(){
  const L=mergedSales(),t=sums(L);
  return `<div class="kpi"><div><small>${ic('trending-up')}Ventes du jour</small><b>${fmt(t.total)}</b></div><div><small>${ic('receipt')}Tickets</small><b>${L.length}</b></div><div><small>${ic('banknote')}Espèces</small><b>${fmt(t.cash)}</b></div><div><small>${ic('smartphone')}Wave</small><b>${fmt(t.wave)}</b></div><div><small>${ic('smartphone')}Orange Money</small><b>${fmt(t.om)}</b></div><div><small>${ic('users')}Crédit</small><b>${fmt(t.credit)}</b></div></div>
  <div class="card"><table><tr><th>Heure</th><th>Ticket</th><th>Vendeur</th><th>Paiement</th><th class="n">Total</th><th></th></tr>
  ${L.map(s=>`<tr><td>${hhmm(s.sold_at)}</td><td>${esc(s.ticket_no)}</td><td>${esc((VEND.find(v=>v.id===s.seller_id)||{}).full_name||'')}</td><td>${(s.sale_payments||[]).map(p=>lab[p.method]).join(' + ')}</td><td class="n">${fmt(s.total)}</td><td>${s.failed?'<span class="badge b-bad" title="'+esc(s.err)+'">à vérifier</span>':s.sync?'<span class="badge b-ok">envoyé</span>':'<span class="badge b-wait">en attente</span>'}</td></tr>`).join('')||'<tr><td colspan="6" class="mu">Aucune vente aujourd’hui.</td></tr>'}</table></div>`;
}

/* ---------- STOCK (commun) ---------- */
function viewStock(es,arts,title){
  const qq=(S.sq||'').toLowerCase(),rows=[];
  for(const a of arts){
    const r=es.filter(x=>x.article_id===a.id);if(!r.length)continue;
    if(qq&&!(a.name+' '+a.id).toLowerCase().includes(qq))continue;
    const det=r.slice().sort((x,y)=>(+x.size||0)-(+y.size||0)||x.size.localeCompare(y.size)).map(x=>`${[x.size,x.color].filter(Boolean).join(' ')||'—'} : <b style="${x.qty<=0?'color:var(--rd)':''}">${x.qty}</b>`).join(' &nbsp;·&nbsp; ');
    rows.push(`<tr><td><b>${esc(a.name)}</b><div class="mu" style="font-size:12px">${esc(a.id)}</div></td><td>${det}</td><td class="n"><b>${r.reduce((s,x)=>s+x.qty,0)}</b></td></tr>`);
  }
  const tot=es.reduce((s,x)=>s+x.qty,0);
  return `<div class="card">${title?'<h2>'+title+'</h2>':''}<div class="row"><input id="sq" style="flex:1" placeholder="Rechercher…" value="${esc(S.sq||'')}"><b>${tot} pièces</b></div>
  <table style="margin-top:8px"><tr><th>Article</th><th>Détail (pointure / couleur : quantité)</th><th class="n">Total</th></tr>${rows.join('')||'<tr><td colspan="3" class="mu">Aucun stock.</td></tr>'}</table></div>`;
}
function bindStock(redraw){
  const s=$('#sq');if(!s)return;
  s.oninput=()=>{S.sq=s.value;const pos=s.selectionStart;(redraw||draw)();const n=$('#sq');n.focus();n.setSelectionRange(pos,pos)};
}

/* ---------- CLÔTURE ---------- */
function viewCloture(){
  const L=mergedSales(),t=sums(L),dayv=dvList();
  const pend=getQ().filter(x=>x.kind==='closure').length,closed=DAYCLOS||pend;
  return `<div class="kpi"><div><small>${ic('trending-up')}Ventes du jour</small><b>${fmt(t.total)}</b></div><div><small>${ic('banknote')}Espèces</small><b>${fmt(t.cash)}</b></div><div><small>${ic('smartphone')}Wave</small><b>${fmt(t.wave)}</b></div><div><small>${ic('smartphone')}Orange Money</small><b>${fmt(t.om)}</b></div><div><small>${ic('users')}Crédit</small><b>${fmt(t.credit)}</b></div></div>
  <div class="card"><h2>${ic('wallet')}Versement de la recette au Central</h2>
  <div class="row"><div style="flex:1;min-width:130px"><label>Montant</label><input id="va" type="number" inputmode="numeric" min="0"></div><div style="flex:1;min-width:130px"><label>Par</label><select id="vm"><option value="wave">Wave</option><option value="om">Orange Money</option></select></div></div>
  <label>Référence de la transaction</label><input id="vr"><button class="btn big" style="margin-top:12px" id="vgo">${ic('wallet',20)}Envoyer le versement</button>
  <table style="margin-top:12px"><tr><th>Heure</th><th>Mode</th><th class="n">Montant</th><th>Statut</th></tr>${dayv.map(v=>`<tr><td>${hhmm(v.created_at)}</td><td>${v.method==='wave'?'Wave':v.method==='om'?'OM':'Espèces'}</td><td class="n">${fmt(v.amount)}</td><td><span class="badge ${v.status==='confirmed'?'b-ok':v.status==='rejected'?'b-bad':'b-wait'}">${v.status==='confirmed'?'confirmé par le Central':v.status==='rejected'?'refusé':v.local?'en attente d’envoi':'en attente de confirmation'}</span></td></tr>`).join('')||'<tr><td colspan="4" class="mu">Aucun versement aujourd’hui.</td></tr>'}</table></div>
  <div class="card"><h2>${ic('lock')}Clôture de la journée</h2>${closed?'<span class="badge b-ok">Journée clôturée</span>':`<label>Espèces comptées en caisse</label><input id="cc" type="number" inputmode="numeric" min="0"><label>Remarque</label><input id="cn"><button class="btn big" style="margin-top:12px" id="cgo">${ic('lock',20)}Clôturer la journée</button>`}</div>`;
}
function dvList(){const ids=new Set(DAYVERS.map(v=>v.id));const l=DAYVERS.map(v=>({...v}));for(const it of getQ())if(it.kind==='versement'&&!ids.has(it.payload.id))l.push({...it.payload,created_at:it.at,local:true});return l.sort((a,b)=>b.created_at.localeCompare(a.created_at))}
function bindCloture(){
  $('#vgo').onclick=()=>{
    const amount=Math.round(+$('#va').value||0);if(amount<=0){toast('Saisissez le montant');return}
    if(!confirm('Envoyer un versement de '+fmt(amount)+' ?'))return;
    const p={id:uid(),store_id:me.store_id,day:dayOf(),amount,method:$('#vm').value,reference:$('#vr').value.trim()||null,status:'pending'};
    setQ([...getQ(),{id:p.id,kind:'versement',payload:p,at:new Date().toISOString()}]);draw();syncQueue();
  };
  const c=$('#cgo');if(c)c.onclick=()=>{
    if(!confirm('Clôturer la journée ?'))return;
    const t=sums(mergedSales());
    const p={id:uid(),store_id:me.store_id,day:dayOf(),total_sales:t.total,cash:t.cash,wave:t.wave,om:t.om,credit:t.credit,counted_cash:$('#cc').value===''?null:Math.round(+$('#cc').value),note:$('#cn').value.trim()||null};
    setQ([...getQ(),{id:p.id,kind:'closure',payload:p,at:new Date().toISOString()}]);draw();syncQueue();
  };
}

/* ---------- DIRECTION ---------- */
const CATS=['Loyer','Salaires','Transport','Repas équipe','Électricité (SENELEC)','Eau (SONES)','Téléphone (fibre optique)','Fournitures','Entretien','Achat marchandises'];
const FIBRE='Téléphone (fibre optique)';

function gapInfo(c){
  const d=(c.counted_cash==null?c.cash:c.counted_cash)-c.cash;
  if(d===0)return {d,lab:'Conforme',cls:'b-ok',act:''};
  if(d>0)return c.gap_status==='surplus_noted'?{d,lab:'Surplus noté',cls:'b-ok',act:''}:{d,lab:'Surplus',cls:'b-wait',act:'note'};
  if(c.gap_status==='accepted')return {d,lab:'Justification acceptée',cls:'b-ok',act:''};
  if(c.gap_status==='lifted')return {d,lab:'Retenue levée',cls:'b-gr',act:''};
  if(c.gap_status==='retained')return {d,lab:'Retenue salaire',cls:'b-bad',act:'lift'};
  return c.note?{d,lab:'À examiner',cls:'b-wait',act:'review'}:{d,lab:'Retenue salaire',cls:'b-bad',act:'lift'};
}

  try{CINV=await q(sb.from('central_invoices').select('*,central_invoice_items(*)').order('issued_at',{ascending:false}).limit(100));D.cbal=await q(sb.from('central_balance').select('*'));await loadDirStock('CEN')}catch(e){toast('Chargement impossible : '+(e.message||e))}
}
const invPaid=(st)=>{const b=D.cbal.find(x=>x.store_id===st)||{invoiced:0,paid:0};return b};
function dirCentral(){
  const isC=me.role==='central',cen=D.stock.CEN||[],aname=id=>(D.arts.find(a=>a.id===id)||{name:id}).name;
  const pcs=cen.reduce((t,r)=>t+Math.max(0,r.qty),0),due=D.cbal.reduce((t,b)=>t+Math.max(0,b.invoiced-b.paid),0);
  const stores=SHOPS.map(k=>`<option value="${k}" ${CV.to===k?'selected':''}>${esc(STORES[k])}</option>`).join('');
  const arts=D.arts.filter(a=>cen.some(r=>r.article_id===a.id&&r.qty>0)).map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');
  const tot=CV.lines.reduce((t,l)=>t+l.qty*l.price,0);
  const sit=SHOPS.map(k=>{const b=invPaid(k),r=b.invoiced-b.paid,li=CINV.filter(i=>i.store_id===k)[0];

  const paidOf=i=>{return null};
  const inv=CINV.slice(0,25).map(i=>`<tr><td><b>${esc(i.invoice_no)}</b></td><td>${dtFr(i.issued_at)}</td><td>${dot(i.store_id)}${esc(STORES[i.store_id])}</td><td class="n">${(i.central_invoice_items||[]).reduce((t,x)=>t+x.qty,0)}</td><td class="n"><b>${fmt(i.total)}</b></td><td class="n"><button class="btn sm sec" data-pi="${i.id}">${ic('printer',16)}Imprimer</button></td></tr>`).join('')||'<tr><td colspan="6" class="mu">Aucune facture pour le moment.</td></tr>';
  const reg=D.vers.filter(v=>v.status==='confirmed').slice(0,10).map(v=>`<tr><td>${dtFr(v.confirmed_at||v.created_at)}</td><td>${esc(STORES[v.store_id])}</td><td>${v.method==='wave'?'Wave':v.method==='om'?'OM':'Espèces'}${v.reference?' · '+esc(v.reference):''}</td><td class="n">${fmt(v.amount)}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">Aucun règlement.</td></tr>';
  const lines=CV.lines.length?`<table><thead><tr><th>Article</th><th class="n">Qté</th><th class="n">Prix</th><th class="n">Montant</th><th></th></tr></thead><tbody>${CV.lines.map((l,i)=>`<tr><td>${esc(aname(l.article_id))}${[l.size&&' · P'+l.size,l.color&&' · '+l.color].filter(Boolean).join('')}</td><td class="n">${l.qty}</td><td class="n">${fmt(l.price)}</td><td class="n">${fmt(l.qty*l.price)}</td><td><button class="btn sm sec" data-rm="${i}">×</button></td></tr>`).join('')}<tr><td colspan="3" class="n"><b>Total</b></td><td class="n"><b>${fmt(tot)}</b></td><td></td></tr></tbody></table>`:'<p class="mu" style="font-size:13px">Aucune ligne. Choisissez un article puis « Ajouter la ligne ».</p>';
  return `<div class="kpi"><div><small>${ic('package')}Stock du Central</small><b>${pcs}</b><small>pièces</small></div><div><small>${ic('store')}Dû par les magasins</small><b style="color:${due?'var(--rd)':'inherit'}">${fmt(due)}</b><small>factures moins versements confirmés</small></div><div><small>${ic('wallet')}Versements à confirmer</small><b>${pendingVers()}</b><small>envoyés par les caissiers</small></div></div>
  ${isC?'':dirVers()}
  <div class="card"><h2>${ic('store')}Situation par magasin <small class="mu" style="font-weight:400">facturé par le Central, réglé, reste dû</small></h2><div class="tw"><table><thead><tr><th>Magasin</th><th class="n">Facturé</th><th class="n">Réglé</th><th class="n">Reste dû</th><th class="n">Avance</th></tr></thead><tbody>${sit}</tbody></table></div></div>
  <div class="grid2" style="grid-template-columns:1fr 1fr"><div class="card"><h2>${ic('file-text')}Nouvelle facture <small class="mu" style="font-weight:400">prix de gros</small></h2>
  <label>Destinataire</label><select id="cto">${stores}</select>
  <label>Article</label><select id="cta"><option value="">— choisir —</option>${arts}</select>
  <label>Pointure / couleur</label><select id="ctc"></select>
  <div class="row"><div style="flex:1"><label>Quantité</label><input id="ctq" type="number" min="1" value="1"></div><div style="flex:1"><label>Prix de gros (F)</label><input id="ctp" type="number" min="0"></div></div>
  <button class="btn sec" id="cadd" style="margin-top:10px">${ic('plus')}Ajouter la ligne</button><div style="margin-top:12px">${lines}</div>
  <div class="row"><div style="flex:1"><label>Acompte reçu (F)</label><input id="cac" type="number" min="0" value="0"></div><div style="flex:1"><label>Mode</label><select id="cmd"><option value="cash">Espèces</option><option value="wave">Wave</option><option value="om">Orange Money</option></select></div></div>
  <button class="btn big" id="cgo" style="margin-top:12px">${ic('check',20)}Établir la facture et livrer</button><div class="err" id="cerr"></div></div>
  ${isC?'<div class="card"><h2>Règlements</h2><div class="tw"><table><tbody>'+reg+'</tbody></table></div></div>':`<div><div class="card"><h2>${ic('wallet')}Règlement reçu</h2><label>Magasin payeur</label><select id="rps">${SHOPS.map(k=>{const b=invPaid(k),r=b.invoiced-b.paid;return `<option value="${k}">${esc(STORES[k])} · dû ${fmt(Math.max(0,r))}</option>`}).join('')}</select>
  <div class="row"><div style="flex:1"><label>Montant (F)</label><input id="rpa" type="number" min="1"></div><div style="flex:1"><label>Mode</label><select id="rpm"><option value="cash">Espèces</option><option value="wave">Wave</option><option value="om">Orange Money</option></select></div></div>
  <button class="btn big" id="rpg" style="margin-top:12px">${ic('check',20)}Enregistrer le règlement</button><div class="err" id="rperr"></div></div>
  <div class="card"><h2>Derniers règlements</h2><div class="tw"><table><tbody>${reg}</tbody></table></div></div></div>`}</div>
  <div class="card"><h2>${ic('file-text')}Factures <small class="mu" style="font-weight:400">${CINV.length} au total</small></h2><div class="tw"><table><thead><tr><th>N°</th><th>Date et heure</th><th>Destinataire</th><th class="n">Pièces</th><th class="n">Total</th><th></th></tr></thead><tbody>${inv}</tbody></table></div></div>`;
}
function printInvoice(i){
  const aname=id=>(D.arts.find(a=>a.id===id)||{name:id}).name,items=i.central_invoice_items||[];
  const b=invPaid(i.store_id);
  const rows=items.map(x=>`<tr><td>${esc(aname(x.article_id))}${[x.size&&' · P'+x.size,x.color&&' · '+x.color].filter(Boolean).join('')}</td><td class="r">${x.qty}</td><td class="r">${fmt(x.unit_price)}</td><td class="r">${fmt(x.qty*x.unit_price)}</td></tr>`).join('');
  const html=`<!doctype html><meta charset="utf-8"><title>${esc(i.invoice_no)}</title><style>body{font:14px Arial,sans-serif;margin:18mm;color:#111}table{border-collapse:collapse;width:100%;margin-top:18px}th,td{border:1px solid #bbb;padding:7px 9px;text-align:left}th{background:#f1f1f1}.r{text-align:right}.h{display:flex;justify-content:space-between;align-items:flex-start}.box{border:1px solid #bbb;padding:10px 14px}.sig{display:flex;justify-content:space-between;margin-top:60px}</style>
  <div class="h"><div><img src="${location.origin}/logo.png" style="max-height:26mm;max-width:80mm"><br><b>MINANE SHOP — Magasin Central</b></div><div class="box"><b style="font-size:18px">FACTURE ${esc(i.invoice_no)}</b><br>${dtFr(i.issued_at)}</div></div>
  <p><b>Destinataire :</b> ${esc(STORES[i.store_id])}</p>
  <table><thead><tr><th>Désignation</th><th class="r">Qté</th><th class="r">Prix unitaire</th><th class="r">Montant</th></tr></thead><tbody>${rows}<tr><td colspan="3" class="r"><b>TOTAL</b></td><td class="r"><b>${fmt(i.total)} </b></td></tr></tbody></table>
  <p>Situation du magasin à ce jour : facturé ${fmt(b.invoiced)} · réglé ${fmt(b.paid)} · reste dû <b>${fmt(Math.max(0,b.invoiced-b.paid))}</b></p>
  <div class="sig"><div>Le Magasin Central</div><div>Le Magasin (reçu conforme)</div></div><script>onload=()=>setTimeout(()=>print(),400)<\/script>`;
  const w=window.open('','_blank');if(!w){toast('Autorisez les fenêtres pour imprimer.');return}w.document.write(html);w.document.close();
}
function bindCentral(){
  if(!CLOADED){loadCentral().then(()=>{if(S.tab==='central')draw()})}
  if(me.role!=='central')bindVers();
  const art=id=>D.arts.find(a=>a.id===id),cen=D.stock.CEN||[];
  let rows=[];
  const upd=()=>{const id=$('#cta').value;rows=cen.filter(r=>r.article_id===id&&r.qty>0);
    $('#ctc').innerHTML=rows.length?rows.map((r,i)=>`<option value="${i}">${esc(comboLabel(r))} — ${r.qty} dispo</option>`).join(''):'<option value="">—</option>';
    const a=art(id);$('#ctp').value=a?(a.wholesale_price??a.price??''):''};
  $('#cta').onchange=upd;$('#cto').onchange=()=>{CV.to=$('#cto').value};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{CV.lines.splice(+b.dataset.rm,1);draw()});
  $('#cadd').onclick=()=>{
    const r=rows[+$('#ctc').value],qty=Math.round(+$('#ctq').value||0),price=Math.round(+$('#ctp').value);
    if(!r||!(qty>0)||!(price>=0)){$('#cerr').textContent='Choisissez un article, une quantité et un prix.';return}
    const dej=CV.lines.filter(l=>l.article_id===r.article_id&&l.size===r.size&&l.color===r.color).reduce((t,l)=>t+l.qty,0);
    if(dej+qty>r.qty){$('#cerr').textContent='Stock du Central insuffisant ('+r.qty+' disponible'+(dej?', dont '+dej+' déjà sur la facture':'')+').';return}
    const ex=CV.lines.find(l=>l.article_id===r.article_id&&l.size===r.size&&l.color===r.color&&l.price===price);
    if(ex)ex.qty+=qty;else CV.lines.push({article_id:r.article_id,size:r.size,color:r.color,qty,price});
    draw();
  };
  $('#cgo').onclick=async()=>{
    if(!CV.lines.length){$('#cerr').textContent='Ajoutez au moins une ligne.';return}
    const paid=Math.round(+$('#cac').value||0),tot=CV.lines.reduce((t,l)=>t+l.qty*l.price,0);
    if(paid<0||paid>tot){$('#cerr').textContent='Acompte invalide (maximum '+fmt(tot)+').';return}
    $('#cgo').disabled=true;
    try{
      const no=await q(sb.rpc('record_invoice',{p_store:CV.to,p_items:CV.lines.map(l=>({article_id:l.article_id,size:l.size,color:l.color,qty:l.qty,unit_price:l.price})),p_paid:paid,p_method:$('#cmd').value}));
      const touched=[...new Set(CV.lines.map(l=>l.article_id))];
      if(me.role!=='central')for(const id of touched){const l=CV.lines.find(x=>x.article_id===id);try{await q(sb.from('articles').update({wholesale_price:l.price}).eq('id',id).select('id'))}catch(e){}}
      CV.lines=[];toast('Facture '+no+' établie : '+fmt(tot));D.stock[CV.to]=null;
      await Promise.all([loadCentral(),me.role==='central'?0:loadDirector()]);draw();
    }catch(e){$('#cerr').textContent='Erreur : '+(e.message||e);$('#cgo').disabled=false}
  };
  document.querySelectorAll('[data-pi]').forEach(b=>b.onclick=()=>printInvoice(CINV.find(x=>x.id===b.dataset.pi)));
  const rg=$('#rpg');if(rg)rg.onclick=async()=>{
    const a=Math.round(+$('#rpa').value||0);if(!(a>0)){$('#rperr').textContent='Saisissez le montant reçu.';return}
    try{await q(sb.from('versements').insert({store_id:$('#rps').value,day:dayStr(0),amount:a,method:$('#rpm').value,reference:'Règlement direct',status:'confirmed',confirmed_by:me.id,confirmed_at:new Date().toISOString()}).select('id'));toast('Règlement de '+fmt(a)+' enregistré');await loadDirector();draw()}catch(e){$('#rperr').textContent='Erreur : '+(e.message||e)}
  };
}

  const st=me.role==='central'?'CEN':D.store;
  return `${me.role==='central'?'':`<div class="card"><label style="margin-top:0">Magasin</label><select id="dst">${Object.keys(STORES).map(k=>`<option value="${k}" ${k===st?'selected':''}>${STORES[k]}</option>`).join('')}</select></div>`}
  ${D.stock[st]?viewStock(D.stock[st],D.arts,esc(STORES[st])):'<div class="card mu">Chargement du stock…</div>'}`;

function bindDirStock(){
  const st=me.role==='central'?'CEN':D.store;
  const sel=$('#dst');if(sel)sel.onchange=async()=>{D.store=sel.value;D.stock[D.store]=null;draw();await loadDirStock(D.store);draw()};
  bindStock(()=>{drawDirector();bindShell()});
  if(!D.stock[st])loadDirStock(st).then(()=>draw());
}

/* ---------- IMPORT INVENTAIRE ---------- */
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const ALIAS={ref:['reference','ref','code','codearticle','id','sku'],name:['designation','nom','article','libelle','produit','description'],cat:['categorie','famille','type','rayon'],price:['prix','prixvente','pv','prixdevente','price'],size:['pointure','taille','size'],color:['couleur','color','coloris'],qty:['quantite','qte','qty','stock']};
function parseInv(rows){
  if(!rows.length)throw new Error('Fichier vide');
  const heads=Object.keys(rows[0]),map={};
  for(const k in ALIAS){const h=heads.find(h=>ALIAS[k].includes(norm(h)));if(h)map[k]=h}
  if(!map.qty||(!map.name&&!map.ref))throw new Error('Colonnes introuvables. Il faut au moins : désignation (ou référence) et quantité.');
  const arts=new Map(),lines=[];
  for(const r of rows){
    const name=String(r[map.name]||'').trim(),ref=String(r[map.ref]||'').trim();
    if(!name&&!ref)continue;
    const id=(ref||'A-'+norm(name).toUpperCase().slice(0,24)).toUpperCase();
    const size=String(r[map.size]??'').trim(),color=String(r[map.color]??'').trim();
    const qty=Math.round(+String(r[map.qty]).replace(/\s/g,'').replace(',','.'));if(!Number.isFinite(qty)||qty<0)continue;
    const price=Math.round(+String(r[map.price]??'').replace(/\s/g,'').replace(',','.'))||0;
    let cat=norm(r[map.cat]);cat=cat.includes('sac')?'sacs':cat.includes('chauss')||cat.includes('soulier')||cat.includes('sandale')?'chaussures':size?'chaussures':cat?'autre':'sacs';
    const a=arts.get(id)||{id,name:name||id,category:cat,price,has_sizes:false,has_colors:false};
    if(name)a.name=name;if(price)a.price=price;if(size)a.has_sizes=true;if(color)a.has_colors=true;arts.set(id,a);
    lines.push({article_id:id,size,color,counted_qty:qty});
  }
  return {arts:[...arts.values()],lines,map};
}
async function readBook(f){
  const buf=await f.arrayBuffer();
  if(/\.csv$/i.test(f.name)||f.type==='text/csv'){
    let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{t=new TextDecoder('windows-1252').decode(buf)}
    t=t.replace(/^\uFEFF/,'');
    const first=t.split(/\r?\n/)[0]||'',cnt=c=>first.split(c).length-1;
    const FS=[[';',cnt(';')],['\t',cnt('\t')],[',',cnt(',')]].sort((a,b)=>b[1]-a[1])[0][0];
    return XLSX.read(t,{type:'string',FS});
  }
  return XLSX.read(buf,{type:'array'});
}
function dirImport(){
  const I=D.imp;
  return `<div class="card"><h2>${ic('clipboard-list')}Charger un inventaire (Excel ou CSV)</h2>
  <div class="mu" style="margin-bottom:8px">Colonnes reconnues : référence, désignation, catégorie, prix, pointure, couleur, quantité. Les quantités du fichier remplacent le stock du magasin choisi, pour les lignes présentes dans le fichier.</div>
  <label>Magasin concerné</label><select id="ist">${Object.keys(STORES).map(k=>`<option value="${k}" ${k===(D.istore||'SAN')?'selected':''}>${STORES[k]}</option>`).join('')}</select>
  <label>Fichier</label><input id="ifile" type="file" accept=".xlsx,.xls,.csv">
  <div id="imsg" class="err">${esc(D.imsg||'')}</div>
  ${I?`<div style="margin-top:10px"><b>${I.arts.length} articles · ${I.lines.length} lignes · ${I.lines.reduce((s,l)=>s+l.counted_qty,0)} pièces</b><table style="margin-top:6px"><tr><th>Réf.</th><th>Désignation</th><th class="n">Prix</th><th>Détail</th></tr>${I.arts.slice(0,8).map(a=>`<tr><td>${esc(a.id)}</td><td>${esc(a.name)}</td><td class="n">${fmt(a.price)}</td><td>${I.lines.filter(l=>l.article_id===a.id).slice(0,6).map(l=>[l.size,l.color].filter(Boolean).join(' ')+' : '+l.counted_qty).join(' · ')}</td></tr>`).join('')}</table>${I.arts.length>8?'<div class="mu">… et '+(I.arts.length-8)+' autres articles</div>':''}
  <button class="btn big" style="margin-top:12px" id="iapply">${ic('upload',20)}Appliquer l’inventaire à ${esc(STORES[D.istore||'SAN'])}</button></div>`:''}</div>`;
}
function bindImport(){
  $('#ist').onchange=e=>{D.istore=e.target.value;draw()};
  $('#ifile').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;D.imp=null;D.imsg='';
    try{const wb=await readBook(f);const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});D.imp=parseInv(rows);D.impName=f.name}
    catch(err){D.imsg=err.message}
    draw();
  };
  const ap=$('#iapply');if(ap)ap.onclick=async()=>{
    const st=D.istore||'SAN',I=D.imp;
    if(!confirm('Appliquer '+I.lines.length+' lignes au stock de '+STORES[st]+' ?'))return;
    ap.disabled=true;ap.textContent='Envoi en cours…';
    try{
      for(let i=0;i<I.arts.length;i+=200)await q(sb.from('articles').upsert(I.arts.slice(i,i+200).map(a=>({...a,updated_at:new Date().toISOString()})),{onConflict:'id'}).select('id'));
      const cur=await qAll(()=>sb.from('stock').select('article_id,size,color,qty').eq('store_id',st).order('article_id'));
      const cm=new Map(cur.map(r=>[r.article_id+'|'+r.size+'|'+r.color,r.qty]));
      const inv=await q(sb.from('inventories').insert({store_id:st,note:'Import '+(D.impName||'')}).select('id').single());
      const rows=I.lines.map(l=>({inventory_id:inv.id,...l,system_qty:cm.get(l.article_id+'|'+l.size+'|'+l.color)||0}));
      for(let i=0;i<rows.length;i+=500)await q(sb.from('inventory_lines').insert(rows.slice(i,i+500)).select('id'));
      D.imp=null;D.imsg='';D.stock[st]=null;toast('Inventaire appliqué : '+rows.length+' lignes');
      D.store=st;S.tab='stock';draw();await loadDirStock(st);draw();
    }catch(err){D.imsg='Erreur : '+(err.message||err);draw()}
  };
}
